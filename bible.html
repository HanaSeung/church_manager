<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6f4f">
  <title>성경 뷰어 · 교회 통합 관리</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --green:#2f6f4f; --green-d:#245a40; --green-soft:#e7f1ec;
      --bg:#f5f6f4; --card:#fff; --text:#1f2421; --muted:#6b726d; --line:#e2e5e1;
      --fs:20px;
    }
    body { font-family:'Malgun Gothic',system-ui,sans-serif; background:var(--bg);
      color:var(--text); line-height:1.6; }
    .topbar { background:var(--green); color:#fff; padding:0 10px; height:52px;
      display:grid; grid-template-columns:40px 1fr 40px; align-items:center; }
    .topbar .tb-back { justify-self:start; width:34px; height:34px; border-radius:50%;
      background:rgba(255,255,255,.16); display:flex; align-items:center;
      justify-content:center; color:#fff; text-decoration:none; }
    .topbar .tb-back svg { width:20px; height:20px; }
    .topbar .tb-icon { justify-self:end; display:flex; align-items:center;
      color:rgba(255,255,255,.9); }
    .topbar .tb-icon svg { width:20px; height:20px; }
    .topbar h1 { font-size:17px; font-weight:500; text-align:center; }
    #fixedHead { position:fixed; top:0; left:0; right:0; z-index:20;
      background:var(--bg); box-shadow:0 2px 6px rgba(0,0,0,.08); }
    #fixedHead .controls { margin:0; border-radius:0; border-left:none; border-right:none; }
    .wrap { max-width:860px; margin:0 auto; padding:14px 16px 60px; }
  </style>
</head>
<body>
  <div id="fixedHead">
  <div class="topbar">
    <a href="index.html" class="tb-back" aria-label="홈으로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1>성경 뷰어</h1>
    <span class="tb-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h11a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M8 4v16"/></svg>
    </span>
  </div>

    <div class="controls" id="controls">
      <div class="row main">
        <div class="grp sels">
          <button id="verBtn" class="verbtn" title="번역본 선택">개역개정</button>
          <button id="locBtn" class="locbox" title="책·장·절 선택">
            <span id="locBook" class="loc-book">창</span><span id="locCV" class="loc-cv">1:1</span>
          </button>
          <button id="stronBtn" class="stronbtn disabled" title="원어(스트롱) 보기">원어</button>
          <button id="parBtn" class="stronbtn" title="병행 보기">병행</button>
          <span id="parBar" class="parbar" style="display:none;"></span>
        </div>
        <div class="grp btns">
          <button id="prevBtn" class="navb ic" title="이전 장">◀</button>
          <button id="nextBtn" class="navb ic" title="다음 장">▶</button>
          <button id="fsDown" class="navb ic" title="글자 작게">가−</button>
          <button id="fsUp" class="navb ic" title="글자 크게">가＋</button>
        </div>
      </div>
    </div>
  </div>

  <div id="pickerOverlay" class="picker-overlay" style="display:none;">
    <div class="picker-box">
      <div class="picker-head">
        <button id="pickerBack" class="pk-back" title="닫기">‹</button>
        <button id="otTab" class="pk-ot">구약</button>
        <button id="ntTab" class="pk-nt">신약</button>
        <span class="pk-spacer"></span>
        <button id="pickerOk" class="pk-ok">확인</button>
      </div>
      <div class="picker-cols">
        <div id="colBook" class="picker-col"></div>
        <div id="colChap" class="picker-col"></div>
        <div id="colVerse" class="picker-col"></div>
      </div>
    </div>
  </div>

  <div id="verOverlay" class="picker-overlay" style="display:none;">
    <div class="picker-box" style="max-width:440px;">
      <div class="picker-head">
        <button id="verBack" class="pk-back" title="닫기">‹</button>
        <span class="pk-title">번역본 선택</span>
        <span style="flex:1;"></span>
        <button id="verImport" class="pk-import" title="번역본·사전 파일 불러오기">＋ 불러오기</button>
      </div>
      <div id="verList" class="picker-col" style="max-height:60vh;"></div>
    </div>
  </div>

  <div id="sheetMask" class="sheet-mask"></div>
  <div id="lexSheet" class="sheet">
    <div class="grip"></div>
    <div class="sh-head">
      <span id="shCode" class="sh-code"></span>
      <span id="shWord" class="sh-word"></span>
      <button id="shX" class="sh-x">×</button>
    </div>
    <div id="shBody" class="sh-body"></div>
  </div>
  <input type="file" id="lexFile" accept=".json,application/json" multiple style="display:none;">
  <div id="toast" class="toast"></div>

  <div class="wrap">
    <div id="status" class="status">데이터를 불러오는 중…</div>
    <div id="content"></div>
  </div>

  <style>
    .controls { background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:8px; margin-bottom:14px; }
    .row { display:flex; gap:4px; align-items:center; }
    .row.main { flex-wrap:nowrap; }
    .grp { display:flex; gap:4px; align-items:center; }
    .grp.sels { flex:1 1 auto; min-width:0; }
    .grp.btns { flex:0 0 auto; justify-content:flex-end; gap:0; }
    .sel { padding:10px 2px; font-size:14px; border:1px solid var(--line);
      border-radius:7px; background:#fff; color:var(--text); min-width:0; }
    .locbox { flex:0 0 auto; padding:5px 10px; font-size:13px; font-weight:500;
      border:1px solid var(--line); background:#fff; border-radius:8px;
      cursor:pointer; text-align:left; white-space:nowrap;
      display:flex; align-items:baseline; gap:4px; }
    .locbox:hover { background:var(--green-soft); }
    .loc-book { color:var(--green); }
    .loc-cv { color:var(--text); }
    .verbtn { flex:0 0 auto; padding:5px 10px; font-size:13px; font-weight:500;
      border:1px solid var(--line); background:#fff; border-radius:8px; color:var(--muted);
      cursor:pointer; white-space:nowrap; }
    .verbtn:hover { background:var(--green-soft); }
    .pk-title { font-size:16px; font-weight:700; color:var(--text); }
    .navb { padding:8px 4px; font-size:14px; border:none; border-radius:0;
      background:none; color:var(--text); cursor:pointer; white-space:nowrap; }
    .navb:hover { color:var(--green); opacity:.8; }
    .navb.ic { flex:0 0 auto; padding:8px 5px; min-width:28px; text-align:center;
      font-size:17px; line-height:1.2; }
    #prevBtn, #nextBtn { font-size:18px; color:var(--green); }
    .picker-overlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.4);
      display:flex; align-items:center; justify-content:center; padding:16px; }
    .picker-box { background:#fff; border-radius:14px; width:100%; max-width:460px;
      max-height:80vh; display:flex; flex-direction:column; overflow:hidden; }
    .picker-head { display:flex; align-items:center; gap:10px;
      padding:12px 14px; border-bottom:1px solid var(--line); }
    .pk-back { border:none; background:none; font-size:24px; font-weight:700; line-height:1;
      color:#2f6fd6; cursor:pointer; padding:0 2px; }
    .pk-ot { border:none; background:none; font-size:16px; font-weight:700;
      color:#2f6fd6; cursor:pointer; padding:2px 4px; }
    .pk-nt { border:none; background:none; font-size:16px; font-weight:700;
      color:#d6442f; cursor:pointer; padding:2px 4px; }
    .pk-ot.on, .pk-nt.on { text-decoration:underline; text-underline-offset:5px; }
    .pk-spacer { flex:1; }
    .pk-direct { border:1px solid var(--line); background:#f5f6f4; color:var(--text);
      font-size:14px; padding:7px 14px; border-radius:8px; cursor:pointer; }
    .pk-ok { border:none; background:none; font-size:16px; font-weight:700;
      color:#d6442f; cursor:pointer; padding:2px 4px; }
    .picker-cols { display:flex; flex:1; min-height:0; }
    .picker-col { flex:1; overflow-y:auto; border-right:1px solid var(--line);
      position:relative; -webkit-overflow-scrolling:touch; }
    .picker-col:last-child { border-right:none; }
    #colChap, #colVerse { flex:0.5; }
    .pick-item { padding:12px 8px; font-size:15px; text-align:center; cursor:pointer;
      border-bottom:1px solid #f0f2ef; }
    .pick-item:hover { background:var(--green-soft); }
    .pick-item.on { background:var(--green); color:#fff; font-weight:700; }
    #colBook .pick-item { font-size:14px; }
    .status { color:var(--muted); font-size:14px; padding:20px 4px; text-align:center; }
    .chap-title { font-size:22px; font-weight:700; color:var(--green-d);
      margin:8px 0 14px; padding-bottom:8px; border-bottom:2px solid var(--green-soft); }
    .verse { font-size:var(--fs); margin-bottom:10px; display:flex; }
    .vnum { flex:0 0 auto; min-width:26px; color:var(--green); font-weight:700;
      font-size:.82em; line-height:1.9; margin-right:6px; }
    .vtext { flex:1; }
    .verse mark { background:#fdf3c0; padding:0 1px; }
    .verse.hl { background:#fff6d8; border-left:3px solid var(--green); border-radius:0;
      padding:6px 10px; margin-left:-13px; transition:background .3s; }
    .searchres { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px; }
    .sr-item { padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
    .sr-item:last-child { border-bottom:none; }
    .sr-item:hover { background:var(--green-soft); }
    .sr-ref { color:var(--green); font-weight:700; font-size:13px; margin-right:8px; }
    .sr-cnt { font-size:14px; }
    .sr-head { display:flex; justify-content:space-between; align-items:center;
      padding:6px 12px 12px; color:var(--muted); font-size:13px; }
    .sr-close { cursor:pointer; color:var(--green); font-weight:700; }
    /* 원어(스트롱) 기능 */
    .stronbtn { flex:0 0 auto; padding:5px 10px; font-size:13px; font-weight:500;
      border:1px solid var(--line); background:#fff; border-radius:8px; color:var(--muted);
      cursor:pointer; white-space:nowrap; }
    .stronbtn.on { background:var(--green); color:#fff; border-color:var(--green); }
    .stronbtn.disabled { opacity:.45; }
    .toast { position:fixed; left:50%; bottom:80px; transform:translateX(-50%) translateY(10px);
      background:rgba(31,36,33,.92); color:#fff; font-size:14px; padding:10px 16px;
      border-radius:20px; z-index:80; opacity:0; pointer-events:none; transition:.25s;
      white-space:nowrap; max-width:90vw; text-align:center; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .pk-import { border:1px solid var(--line); background:#f5f6f4; color:var(--green-d);
      font-size:13px; font-weight:600; padding:5px 10px; border-radius:8px; cursor:pointer; }
    .pk-import:hover { background:var(--green-soft); }
    body.stron .vtext .w.has { border-bottom:1.5px dotted var(--green); color:var(--green-d); cursor:pointer; }
    body.stron .vtext .w.has:active { background:var(--green-soft); }
    .sheet-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); opacity:0;
      pointer-events:none; transition:.2s; z-index:60; }
    .sheet-mask.show { opacity:1; pointer-events:auto; }
    .sheet { position:fixed; left:0; right:0; bottom:0; z-index:70; background:#fff;
      border-radius:16px 16px 0 0; max-height:74vh; transform:translateY(100%);
      transition:transform .25s; display:flex; flex-direction:column;
      box-shadow:0 -4px 20px rgba(0,0,0,.15); }
    .sheet.show { transform:translateY(0); }
    .sheet .grip { width:38px; height:4px; border-radius:2px; background:#d7dbd7; margin:8px auto 0; }
    .sheet .sh-head { display:flex; align-items:center; gap:10px; padding:12px 16px 10px;
      border-bottom:1px solid var(--line); }
    .sheet .sh-code { background:var(--green-soft); color:var(--green-d); font-weight:700;
      font-size:13px; padding:3px 9px; border-radius:6px; }
    .sheet .sh-word { font-size:15px; color:var(--muted); flex:1; }
    .sheet .sh-x { border:none; background:none; font-size:22px; color:var(--muted);
      cursor:pointer; line-height:1; padding:0 4px; }
    .sheet .sh-body { overflow-y:auto; padding:14px 18px 26px; font-size:15px; line-height:1.75; }
    .sheet .sh-body num { color:#2f6fd6; font-weight:600; }
    .sheet .noentry { color:var(--muted); font-size:14px; }
    /* 각주·상호참조·이탤릭 */
    .vtext em, .sh-body em { font-style:italic; }
    .fn { color:#2f6fd6; cursor:pointer; font-size:.68em; vertical-align:super;
      font-weight:700; padding:0 1px; line-height:0; }
    .xref { color:#2f6fd6; cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
    /* 번역본 선택창: 이름(왼쪽) + 서술형 해설(오른쪽) */
    #verList .pick-item { text-align:left; display:flex; align-items:flex-start; gap:10px; padding:11px 14px;
      user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
    #verList .ver-name { font-weight:700; flex:0 0 96px; }
    #verList .ver-desc { color:var(--muted); font-size:12px; line-height:1.35; flex:1 1 auto; text-align:left; }
    #verList .pick-item.on .ver-desc { color:rgba(255,255,255,.85); }
    #verList .ver-handle { flex:0 0 auto; color:#9aa39c; cursor:grab; font-size:20px;
      padding:8px 12px 8px 2px; margin:-8px 0; touch-action:none; user-select:none;
      -webkit-user-select:none; }
    #verList .pick-item.on .ver-handle { color:rgba(255,255,255,.7); }
    #verList .sortable-ghost { opacity:.4; }
    #verList .sortable-chosen { background:var(--green-soft); }
    /* 병행 슬롯 바 */
    .parbar { display:flex; gap:5px; align-items:center; flex:1 1 auto; min-width:0;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      border-left:1.5px solid var(--line); margin-left:4px; padding:0 2px 0 8px; }
    .parbar::-webkit-scrollbar { height:0; }
    .parbar > * { flex:0 0 auto; }
    .parchip { display:flex; align-items:center; gap:5px; background:var(--green-soft);
      color:var(--green-d); border-radius:16px; padding:4px 5px 4px 11px; font-size:13px; font-weight:600; }
    .parchip .pname { cursor:pointer; }
    .parchip .parx { cursor:pointer; opacity:.55; font-size:12px; padding:0 4px; }
    .parchip .parx:active { opacity:1; }
    .paradd { border:1px dashed var(--line); color:var(--green); background:#fff;
      border-radius:16px; padding:3px 13px; font-size:16px; font-weight:700; cursor:pointer; line-height:1.4; }
    .parbase { font-size:12.5px; color:var(--muted); font-weight:600; padding:4px 4px 4px 2px; }
    /* 병행 절 카드 (안1) */
    body.par .pv { background:var(--card); border:1px solid var(--line); border-radius:12px;
      padding:12px 14px 12px 12px; margin-bottom:12px; display:flex; gap:10px; }
    body.par .pv .pvnum { flex:0 0 auto; min-width:26px; height:26px; background:var(--green);
      color:#fff; border-radius:8px; font-size:13px; font-weight:700; display:flex;
      align-items:center; justify-content:center; }
    body.par .pv .pvbody { flex:1; display:flex; flex-direction:column; gap:7px; min-width:0; }
    body.par .pv .pvrow { display:flex; flex-direction:column; gap:1px; }
    body.par .pv .plabel { font-size:11px; font-weight:700; color:var(--green-d);
      background:var(--green-soft); align-self:flex-start; padding:1px 7px; border-radius:5px; }
    body.par .pv .plabel.eng { color:#2f6fd6; background:#e8f0fb; }
    body.par .pv .ptext { font-size:var(--fs); }
  </style>

  <script src="Sortable.min.js"></script>
  <script>
    function adjustHeadSpace() {
      var head = document.getElementById('fixedHead');
      var wrap = document.querySelector('.wrap');
      if (head && wrap) wrap.style.paddingTop = (head.offsetHeight + 12) + 'px';
    }
    window.addEventListener('resize', adjustHeadSpace);
    window.addEventListener('load', adjustHeadSpace);

    var BIBLE = null;
    var curBook = 0, curChap = 0;
    var FS_MIN = 14, FS_MAX = 40;
    var FS = 20;
    try { var _sf = parseInt(localStorage.getItem('bibleFontPx'), 10); if (_sf >= FS_MIN && _sf <= FS_MAX) FS = _sf; } catch (e) {}
    var VERSIONS = [];
    var DEPLOYED_VERSIONS = [];
    var IMPORTED_VERSIONS = [];
    var curVersion = '개역개정';

    var locBtn = document.getElementById('locBtn');
    var locBook = document.getElementById('locBook');
    var locCV = document.getElementById('locCV');
    var verBtn = document.getElementById('verBtn');
    var verOverlay = document.getElementById('verOverlay');
    var verList = document.getElementById('verList');
    var pickerOverlay = document.getElementById('pickerOverlay');
    var colBook = document.getElementById('colBook');
    var colChap = document.getElementById('colChap');
    var colVerse = document.getElementById('colVerse');
    var contentEl = document.getElementById('content');
    var statusEl = document.getElementById('status');
    var curVerse = 1;

    // DB 준비 후 앱 시작 (배포 목록 + 임포트 목록 병합)
    function startApp() {
      fetch('data/bible/versions.json')
        .then(function (r) { return r.ok ? r.json() : ['개역개정']; })
        .then(function (list) {
          DEPLOYED_VERSIONS = (list && list.length) ? list : ['개역개정'];
          refreshVersions(function () {
            curVersion = VERSIONS[0] || '개역개정';
            loadVersion(curVersion, 0, 0);
          });
        })
        .catch(function () {
          DEPLOYED_VERSIONS = ['개역개정'];
          refreshVersions(function () { loadVersion('개역개정', 0, 0); });
        });
    }
    openLexDB(startApp);

    // 이름 정규화 (괄호·공백 제거, 소문자) — 중복 판별용. 예: "NIV(2011)"="NIV2011"
    function normName(s) { return String(s).replace(/[()\s]/g, '').toLowerCase(); }

    // 배포 번역본 + 임포트 번역본 병합 → 목록 갱신 (기본 제공과 중복은 숨김)
    function refreshVersions(cb) {
      getVersionKeys(function (keys) {
        IMPORTED_VERSIONS = keys || [];
        var merged = DEPLOYED_VERSIONS.slice();
        var deployedNorm = DEPLOYED_VERSIONS.map(normName);
        IMPORTED_VERSIONS.forEach(function (k) {
          if (deployedNorm.indexOf(normName(k)) !== -1) return; // 기본 제공과 중복 → 숨김
          if (merged.indexOf(k) === -1) merged.push(k);
        });
        VERSIONS = applyVerOrder(merged);
        buildVersionOptions();
        cb && cb();
      });
    }

    var HEB = false; // 현재 번역본이 히브리어(오른쪽→왼쪽)인지

    // 번역본 서술형 해설 (선택창 오른쪽에 표시)
    var VER_DESC = {
      '개역개정': '한국 교회가 표준으로 쓰는 공인 개정 번역',
      '쉬운성경': '누구나 이해하기 쉽게 풀어 쓴 우리말 번역',
      'NIV(2011)': '자연스러운 현대 영어 번역',
      'KJV(1611)': '1611년 흠정역, 고전 영어의 대표 번역',
      '개역개정S': '단어마다 원어(히브리·헬라) 뜻을 볼 수 있는 스트롱 번역',
      'ESV': '원문에 충실한 직역 위주의 영어 번역',
      '새번역': '원문에 충실하면서 현대 한국어로 다듬은 번역',
      '현대인': '뜻을 쉽게 풀어 옮긴 의역 번역',
      '공동번역': '개신교와 천주교가 함께 만든 문학적 번역',
      'NASB': '가장 직역에 가까운 영어 번역, 원어 연구에 유용',
      'BHSStp': '히브리어 구약 원문 (BHS)',
      'LXXStp': '헬라어 구약, 70인역 (LXX)'
    };

    function buildVersionOptions() {
      verList.innerHTML = '';
      VERSIONS.forEach(function (v) {
        var el = document.createElement('div');
        el.className = 'pick-item ver-item' + (v === curVersion ? ' on' : '');
        el.setAttribute('data-ver', v);
        var h = document.createElement('span');
        h.className = 'ver-handle'; h.textContent = '≡'; h.title = '드래그로 순서 변경';
        el.appendChild(h);
        var nm = document.createElement('span');

        nm.textContent = v;
        el.appendChild(nm);

          verOverlay.style.display = 'none';

        });

    // 드래그로 번역본 순서 변경 — SortableJS (터치·마우스 안정 지원)
    function saveVerOrderFromDOM() {
      var order = [];
      verList.querySelectorAll('.ver-item').forEach(function (el) { order.push(el.getAttribute('data-ver')); });
      VERSIONS = order.slice();

      });

    // 저장된 사용자 순서 적용 (새 번역본은 뒤에 붙임)
    function applyVerOrder(list) {
      var saved = [];
      try { saved = JSON.parse(localStorage.getItem('bibleVerOrder') || '[]'); } catch (e) {}
      if (!saved.length) return list;
      var out = [];
      saved.forEach(function (n) { if (list.indexOf(n) !== -1 && out.indexOf(n) === -1) out.push(n); });
      list.forEach(function (n) { if (out.indexOf(n) === -1) out.push(n); });
      return out;
    }

    function applyBible(data, version, bookIdx, chapIdx) {
      BIBLE = data;
      try { HEB = /[֐-׿]/.test((data.books[0].chapters[0][0]) || ''); } catch (e) { HEB = false; }
      curVersion = version;
      verBtn.textContent = version;
      buildVersionOptions();
      detectCodes();
      statusEl.style.display = 'none';
      showChapter(bookIdx || 0, chapIdx || 0);
      adjustHeadSpace();

    function loadVersion(version, bookIdx, chapIdx) {
      statusEl.style.display = 'block';
      statusEl.textContent = version + ' 데이터를 불러오는 중…';
      contentEl.style.display = 'none';
      if (IMPORTED_VERSIONS.indexOf(version) !== -1 && DEPLOYED_VERSIONS.indexOf(version) === -1) {
        // 개인 임포트 번역본(기본 제공 아님) → IndexedDB에서 로드
        getVersion(version, function (data) {
          if (data && data.books) { applyBible(data, version, bookIdx, chapIdx); }
          else { statusEl.style.display = 'block'; statusEl.textContent = version + ' 데이터를 불러오지 못했습니다.'; }
        });
        return;
      }
      // 배포 번역본 → 파일에서 로드
      fetch('data/bible/' + encodeURIComponent(version) + '.json')
        .then(function (r) {
          if (!r.ok) throw new Error('not found');
          return r.json();
        })
        .then(function (data) { applyBible(data, version, bookIdx, chapIdx); })
        .catch(function () {
          statusEl.style.display = 'block';
          statusEl.textContent = version + ' 데이터를 불러오지 못했습니다. data/bible/' + version + '.json 파일을 확인하세요.';
        });
    }

    function updateLocBtn() {

    function showChapter(bookIdx, chapIdx, jumpVerse) {
      curBook = bookIdx; curChap = chapIdx;
      curVerse = jumpVerse && jumpVerse >= 1 ? jumpVerse : 1;
      contentEl.style.display = 'block';
      contentEl.dir = HEB ? 'rtl' : 'ltr'; // 히브리어는 오른쪽→왼쪽

      updateLocBtn();

      var book = BIBLE.books[bookIdx];

      CUR_FN = {}; // 장 바뀔 때 각주 초기화
      var html = '<div class="chap-title">' + book.name + ' ' + (chapIdx + 1) + '장</div>';

    // 화면 맨 위에 보이는 절을 찾아 표시 갱신
    function updateTopVerse() {
      if (!BIBLE) return;
      var head = document.getElementById('fixedHead');
      var threshold = (head ? head.offsetHeight : 0) + 8;
      var verses = contentEl.querySelectorAll('.verse');
      var top = 1;
      for (var i = 0; i < verses.length; i++) {
        if (verses[i].getBoundingClientRect().top <= threshold) top = i + 1;
        else break;
      }
      if (top !== curVerse) {
        curVerse = top;
        locCV.textContent = (curChap + 1) + ':' + curVerse;
      }
    }

    function escapeHtml(s) {

    function setFont(v) {

    // ===== 원어(스트롱) 기능 =====
    var HAS_CODES = false;
    var stronBtn = document.getElementById('stronBtn');
    var sheetMask = document.getElementById('sheetMask');
    var sheetEl = document.getElementById('lexSheet');
    var lexFile = document.getElementById('lexFile');
    var LEXDB = null;

    // 개인 저장소 (IndexedDB — 기기 내부, 서버 전송 없음)
    //  store 'lex'      : 원어사전 { 코드: 뜻 }
    //  store 'versions' : 임포트한 번역본 { 이름: 성경JSON }
    function openLexDB(cb) {
      try {
        var req = indexedDB.open('bibleLex', 2);
        req.onupgradeneeded = function (e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains('lex')) db.createObjectStore('lex');
          if (!db.objectStoreNames.contains('versions')) db.createObjectStore('versions');
        };
        req.onsuccess = function (e) { LEXDB = e.target.result; cb && cb(); };
        req.onerror = function () { LEXDB = null; cb && cb(); };
      } catch (e) { LEXDB = null; cb && cb(); }
    }

    // 임포트 번역본 저장/조회
    function putVersion(name, obj, cb) {
      if (!LEXDB) { cb && cb(); return; }
      try {
        var tx = LEXDB.transaction('versions', 'readwrite');
        tx.objectStore('versions').put(obj, name);
        tx.oncomplete = function () { cb && cb(); };
        tx.onerror = function () { cb && cb(); };
      } catch (e) { cb && cb(); }
    }
    function getVersion(name, cb) {
      if (!LEXDB) { cb(null); return; }
      try {
        var r = LEXDB.transaction('versions', 'readonly').objectStore('versions').get(name);
        r.onsuccess = function () { cb(r.result || null); };
        r.onerror = function () { cb(null); };
      } catch (e) { cb(null); }
    }
    function getVersionKeys(cb) {
      if (!LEXDB) { cb([]); return; }
      try {
        var r = LEXDB.transaction('versions', 'readonly').objectStore('versions').getAllKeys();
        r.onsuccess = function () { cb(r.result || []); };
        r.onerror = function () { cb([]); };
      } catch (e) { cb([]); }
    }

    function lexGet(code, cb) {
      if (!LEXDB) { cb(null); return; }
      try {
        var r = LEXDB.transaction('lex', 'readonly').objectStore('lex').get(code);
        r.onsuccess = function () { cb(r.result || null); };
        r.onerror = function () { cb(null); };
      } catch (e) { cb(null); }
    }
    function lexCount(cb) {
      if (!LEXDB) { cb(0); return; }
      try {
        var r = LEXDB.transaction('lex', 'readonly').objectStore('lex').count();
        r.onsuccess = function () { cb(r.result || 0); };
        r.onerror = function () { cb(0); };
      } catch (e) { cb(0); }
    }
    function lexImport(obj, cb) {
      if (!LEXDB) { cb(false); return; }
      try {
        var tx = LEXDB.transaction('lex', 'readwrite');
        var store = tx.objectStore('lex');
        Object.keys(obj).forEach(function (k) { store.put(obj[k], k); });
        tx.oncomplete = function () { cb(true); };
        tx.onerror = function () { cb(false); };
      } catch (e) { cb(false); }
    }

    var CUR_FN = {}; // 현재 장 각주: "절번호|마커" -> 각주 HTML

    // 각주 본문 렌더 (이탤릭, 상호참조 링크)
    function renderNote(body) {
      var S1='\u0001',S2='\u0002',S3='\u0003',S4='\u0004',S5='\u0005',S6='\u0006';
      var t = body;
      // 상호참조 앵커 + 뒤따르는 숫자 → 링크 자리표시
      t = t.replace(/<a name='B:\d+\s+(\d+):(\d+)'>\s*(\d+)/g, function (_, ch, v, disp) {
        return S1 + ch + S2 + v + S3 + disp + S4;
      });
      // 이탤릭 자리표시
      t = t.replace(/<i>([\s\S]*?)<\/i>/g, function (_, x) { return S5 + x + S6; });
      t = t.replace(/<[^>]*>/g, '');           // 나머지 태그 제거
      t = escapeHtml(t);                         // 텍스트 escape
      // 자리표시 복원
      t = t.replace(new RegExp(S5 + '([\\s\\S]*?)' + S6, 'g'), '<em>$1</em>');
      t = t.replace(new RegExp(S1 + '(\\d+)' + S2 + '(\\d+)' + S3 + '(\\d+)' + S4, 'g'),
        '<a class="xref" data-c="$1" data-v="$2">$3</a>');
      return t.replace(/\s+/g, ' ').trim();
    }

    // 주 본문 렌더 (이탤릭 + 각주 마커)
    function renderMain(main, vnum) {
      var out = '', re = /<i>([\s\S]*?)<\/i>|<sup>([\s\S]*?)<\/sup>|<[^>]*>|([^<]+)/g, m;
      while ((m = re.exec(main)) !== null) {
        if (m[1] !== undefined) out += '<em>' + escapeHtml(m[1]) + '</em>';
        else if (m[2] !== undefined) {
          var mk = m[2].replace(/<[^>]*>/g, '');
          out += '<sup class="fn" data-v="' + vnum + '" data-fn="' + escapeHtml(mk) + '">' + escapeHtml(mk) + '</sup>';
        }
        else if (m[3] !== undefined) out += escapeHtml(m[3]);
        // else: 기타 태그 제거
      }
      return out;
    }

    // 본문 렌더: 원어 코드 / 각주·이탤릭 / 순수 텍스트
    function renderVerseText(txt, vnum) {
      if (!txt) return '';
      // 1) 원어(스트롱) 코드 번역본
      if (txt.indexOf('<W') !== -1) {
        var html = '', re = /([^<]*)<W([HG]\d+[a-z]?)>/g, m, last = 0;
        while ((m = re.exec(txt)) !== null) {
          var seg = m[1], code = m[2];
          var tappable = (code !== 'G0' && code !== 'H0');
          html += '<span class="w' + (tappable ? ' has' : '') + '" data-code="' + code + '">' + escapeHtml(seg) + '</span>';
          last = re.lastIndex;
        }
        if (last < txt.length) html += escapeHtml(txt.slice(last));
        return html;
      }
      // 2) 순수 텍스트(태그 없음) — 개역개정 등
      if (txt.indexOf('<') === -1 && txt.indexOf('▷') === -1) return escapeHtml(txt);
      // 3) 각주/이탤릭 번역본 (ESV·새번역 등)
      var main = txt, notesRaw = '';
      var bi = txt.indexOf('▷');
      if (bi !== -1) { main = txt.slice(0, bi); notesRaw = txt.slice(bi + 1); }
      if (notesRaw) {
        var parts = notesRaw.split(/<sup>([\s\S]*?)<\/sup>/);
        for (var i = 1; i < parts.length; i += 2) {
          var marker = parts[i].replace(/<[^>]*>/g, '').trim();
          if (marker) CUR_FN[vnum + '|' + marker] = renderNote(parts[i + 1] || '');
        }
      }
      return renderMain(main.replace(/<br\s*\/?>\s*$/, ''), vnum);
    }

    // 토스트 (비침습 알림)
    var toastEl = document.getElementById('toast');
    var toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
    }

    var PENDING_STRON = false;

    // 원어 모드 켜기 (사전 없으면 임포트 유도)
    function enableStron() {
      lexCount(function (n) {
        if (n === 0) {
          if (confirm('원어사전이 필요합니다.\n사전 파일(lexicon_ko.json)을 불러올까요?')) lexFile.click();
          return;
        }
        document.body.classList.add('stron');
        stronBtn.classList.add('on');
        try { localStorage.setItem('bibleStron', '1'); } catch (e) {}
      });

    // 현재 버전이 스트롱 코드를 가졌는지 감지 → 원어 버튼 활성/비활성
    function detectCodes() {
      HAS_CODES = false;
      try { HAS_CODES = (BIBLE.books[0].chapters[0][0] || '').indexOf('<W') !== -1; } catch (e) {}
      stronBtn.classList.toggle('disabled', !HAS_CODES);
      if (!HAS_CODES) {
        document.body.classList.remove('stron');
        stronBtn.classList.remove('on');
        return;
      }
      if (PENDING_STRON) {
        PENDING_STRON = false;
        enableStron();
      } else if (localStorage.getItem('bibleStron') === '1') {
        lexCount(function (n) {
          if (n > 0) { document.body.classList.add('stron'); stronBtn.classList.add('on'); }
        });
      }
    }

    // 원어 버튼: 개역개정S면 토글 / 다른 번역본이면 개역개정S로 자동 전환 후 켜기
    stronBtn.addEventListener('click', function () {
      if (!HAS_CODES) {
        if (VERSIONS.indexOf('개역개정S') === -1) { toast('개역개정S 번역본이 없습니다'); return; }
        PENDING_STRON = true;
        toast('개역개정S(원어)로 전환했습니다');
        loadVersion('개역개정S', curBook, curChap);
        return;
      }
      if (document.body.classList.contains('stron')) {
        document.body.classList.remove('stron');
        stronBtn.classList.remove('on');
        try { localStorage.setItem('bibleStron', '0'); } catch (e) {}
      } else {
        enableStron();
      }
    });

    // 임포트 코어 — payloads: [{name, text}] (번역본/원어사전 자동 판별)
    function _importPayloads(payloads, done) {
      var res = { added: [], lex: 0, errors: 0, skipped: 0 };
      var deployedNorm = DEPLOYED_VERSIONS.map(normName);
      var i = 0;
      (function next() {
        if (i >= payloads.length) { done(res); return; }
        var p = payloads[i++];
        var obj;
        try { obj = JSON.parse(p.text); } catch (e) { res.errors++; return next(); }
        if (obj && obj.books) {
          var fbase = String(p.name || '').replace(/\.json$/i, '');
          var name = obj.version || fbase || '번역본';
          // 기본 제공 번역본과 중복이면 저장하지 않음 (웹에서 옴)
          if (deployedNorm.indexOf(normName(name)) !== -1 || (fbase && deployedNorm.indexOf(normName(fbase)) !== -1)) {
            res.skipped++; return next();
          }
          obj.version = name;
          putVersion(name, obj, function () { if (res.added.indexOf(name) === -1) res.added.push(name); next(); });
        } else if (obj && typeof obj === 'object') {
          var keys = Object.keys(obj);
          if (keys.length && /^[HG]\d/.test(keys[0])) {
            lexImport(obj, function () { res.lex += keys.length; next(); }); // 원어사전
          } else { res.errors++; next(); }
        } else { res.errors++; next(); }
      })();
    }

    // 파일(File[]) → 텍스트로 읽어 임포트
    function importFiles(fileList, done) {
      var arr = Array.prototype.slice.call(fileList);
      if (!arr.length) { done({ added: [], lex: 0, errors: 0 }); return; }
      var payloads = [], pending = arr.length;
      arr.forEach(function (f) {
        var reader = new FileReader();
        reader.onload = function () { payloads.push({ name: f.name, text: reader.result }); if (--pending === 0) _importPayloads(payloads, done); };
        reader.onerror = function () { if (--pending === 0) _importPayloads(payloads, done); };
        reader.readAsText(f);
      });
    }

    // 텍스트 payload 직접 임포트 (공유 받기용)
    function importTexts(payloads, done) { _importPayloads(payloads, done); }

    // 파일 선택 → 임포트 (번역본/사전 공용, 다중 선택)
    lexFile.addEventListener('change', function () {
      var input = this;
      var files = input.files; if (!files || !files.length) return;
      statusEl.style.display = 'block';
      statusEl.textContent = '불러오는 중…';
      importFiles(files, function (res) {
        input.value = '';
        statusEl.style.display = 'none';
        var msg = [];
        if (res.added.length) msg.push('번역본 ' + res.added.length + '개');
        if (res.lex) msg.push('원어사전');
        if (res.skipped) msg.push('중복제외 ' + res.skipped);
        if (res.errors) msg.push('실패 ' + res.errors);
        toast(msg.length ? ('불러오기 완료: ' + msg.join(', ')) : '불러온 파일이 없습니다');
        refreshVersions();
        if (res.lex && HAS_CODES) {
          document.body.classList.add('stron'); stronBtn.classList.add('on');
          try { localStorage.setItem('bibleStron', '1'); } catch (e) {}
        }
      });
    });

    // 번역본 선택창의 '불러오기' 버튼
    (function () {
      var vi = document.getElementById('verImport');
      if (vi) vi.addEventListener('click', function () { lexFile.click(); });
    })();

    // 본문 탭: 각주(①) / 상호참조 / 원어 단어
    contentEl.addEventListener('click', function (e) {
      var t = e.target;
      var fn = t.closest ? t.closest('.fn') : null;
      if (fn) { openFn(fn.getAttribute('data-v'), fn.getAttribute('data-fn')); return; }
      var xr = t.closest ? t.closest('.xref') : null;
      if (xr) { jumpXref(xr); return; }
      if (document.body.classList.contains('stron')) {
        var el = t.closest ? t.closest('.w.has') : null;
        if (el) openSheet(el.getAttribute('data-code'), el.textContent.trim());
      }
    });

    // 각주 보기 (하단 시트 재사용)
    function openFn(vnum, marker) {
      var html = CUR_FN[vnum + '|' + marker] || '(각주 내용 없음)';
      document.getElementById('shCode').textContent = '각주 ' + marker;
      var ab = (BIBLE && BIBLE.books[curBook]) ? (BIBLE.books[curBook].abbr || '') : '';
      document.getElementById('shWord').textContent = ab + ' ' + (curChap + 1) + ':' + vnum;
      document.getElementById('shBody').innerHTML = html;
      sheetMask.classList.add('show'); sheetEl.classList.add('show');
    }
    // 상호참조 이동 (현재 책 기준)
    function jumpXref(el) {
      var c = parseInt(el.getAttribute('data-c'), 10), v = parseInt(el.getAttribute('data-v'), 10);
      closeSheet();
      if (c >= 1 && BIBLE && c <= BIBLE.books[curBook].chapters.length) showChapter(curBook, c - 1, v);
    }
    // 시트 안 상호참조 클릭
    document.getElementById('shBody').addEventListener('click', function (e) {
      var xr = e.target.closest ? e.target.closest('.xref') : null;
      if (xr) jumpXref(xr);
    });

    function openSheet(code, word) {
      lexGet(code, function (txt) {
        document.getElementById('shCode').textContent = code;
        document.getElementById('shWord').textContent = word;
        document.getElementById('shBody').innerHTML = txt
          ? txt.replace('^', '<br>')
          : '<span class="noentry">이 단어의 원어 뜻 정보가 없습니다.</span>';
        sheetMask.classList.add('show');
        sheetEl.classList.add('show');
      });
    }
    function closeSheet() { sheetMask.classList.remove('show'); sheetEl.classList.remove('show'); }
    document.getElementById('shX').addEventListener('click', closeSheet);
    sheetMask.addEventListener('click', closeSheet);

    // ===== 병행 보기 (현재 번역본 기준 + 추가 최대 2개) =====
    var parBtn = document.getElementById('parBtn');
    var parBar = document.getElementById('parBar');
    var PAR_ON = false, PAR_EXTRA = [], PAR_CACHE = {}, PAR_PICK_IDX = -1;
    try { PAR_EXTRA = JSON.parse(localStorage.getItem('bibleParExtra') || '[]') || []; } catch (e) {}
    if (PAR_EXTRA.length > 2) PAR_EXTRA = PAR_EXTRA.slice(0, 2);

    function savePar() { try { localStorage.setItem('bibleParExtra', JSON.stringify(PAR_EXTRA)); } catch (e) {} }
    function isEngVer(nm) { return /^(ESV|NIV|KJV|NASB|LXX|NKJV|NLT|NRSV|RSV|NET|AMP|CSB|GNT|MSG|YLT|MLV|Darby|NHEB)/.test(nm); }

    // 표시 목록: 현재(기준) + 추가(기준·중복 제외), 최대 3
    function parList() {
      var out = [curVersion];
      PAR_EXTRA.forEach(function (n) { if (out.indexOf(n) === -1) out.push(n); });
      return out.slice(0, 3);
    }

    function renderParBar() {
      parBar.innerHTML = '';
      var base = document.createElement('span'); base.className = 'parbase';
      base.textContent = curVersion + ' · 기준';
      parBar.appendChild(base);
      PAR_EXTRA.forEach(function (nm, idx) {
        var chip = document.createElement('span'); chip.className = 'parchip';
        var t = document.createElement('span'); t.className = 'pname'; t.textContent = nm;
        t.addEventListener('click', function () { openParPick(idx); });
        chip.appendChild(t);
        var x = document.createElement('span'); x.className = 'parx'; x.textContent = '✕';
        x.addEventListener('click', function () { PAR_EXTRA.splice(idx, 1); savePar(); renderParBar(); renderParallel(); });
        chip.appendChild(x);
        parBar.appendChild(chip);
      });
      if (PAR_EXTRA.length < 2) {
        var add = document.createElement('span'); add.className = 'paradd'; add.textContent = '＋';
        add.title = '번역본 추가';
        add.addEventListener('click', function () { openParPick(PAR_EXTRA.length); });
        parBar.appendChild(add);
      }
      adjustHeadSpace();
    }

    function openParPick(idx) { PAR_PICK_IDX = idx; buildVersionOptions(); verOverlay.style.display = 'flex'; }
    function pickParVersion(v) {
      var idx = PAR_PICK_IDX; PAR_PICK_IDX = -1;
      verOverlay.style.display = 'none';
      if (v !== curVersion && PAR_EXTRA.indexOf(v) === -1) {   // 기준·중복 제외
        if (idx >= PAR_EXTRA.length) PAR_EXTRA.push(v); else PAR_EXTRA[idx] = v;
      }
      if (PAR_EXTRA.length > 2) PAR_EXTRA = PAR_EXTRA.slice(0, 2);
      savePar(); renderParBar(); renderParallel();
    }

    // 번역본 데이터 로드 (캐시) — 배포본은 fetch, 개인 임포트는 IndexedDB
    function getVersionData(name, cb) {
      if (PAR_CACHE[name]) { cb(PAR_CACHE[name]); return; }
      if (IMPORTED_VERSIONS.indexOf(name) !== -1 && DEPLOYED_VERSIONS.indexOf(name) === -1) {
        getVersion(name, function (d) { if (d) PAR_CACHE[name] = d; cb(d); });
      } else {
        fetch('data/bible/' + encodeURIComponent(name) + '.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (d) PAR_CACHE[name] = d; cb(d); })
          .catch(function () { cb(null); });
      }
    }

    // 병행용 순수 텍스트 (원어 코드·각주 제거)
    function parText(txt) {
      if (!txt) return '';
      txt = txt.replace(/<W[HG]\d+[a-z]?>/g, '');
      txt = txt.split('▷')[0].replace(/<[^>]*>/g, '');
      return escapeHtml(txt.replace(/\s+/g, ' ').trim());
    }

    function renderParallel() {
      if (!PAR_ON) return;
      var list = parList(), datas = {}, pending = list.length;
      list.forEach(function (nm) { getVersionData(nm, function (d) { datas[nm] = d; if (--pending === 0) paintParallel(list, datas); }); });
    }
    function paintParallel(list, datas) {
      var base = datas[list[0]] || null, i;
      if (!base) { for (i = 0; i < list.length; i++) { if (datas[list[i]]) { base = datas[list[i]]; break; } } }
      if (!base) { contentEl.innerHTML = '<div class="status">번역본을 불러오지 못했습니다.</div>'; return; }
      var book = base.books[curBook], verses = book.chapters[curChap];
      var html = '<div class="chap-title">' + book.name + ' ' + (curChap + 1) + '장</div>';
      for (var v = 0; v < verses.length; v++) {
        html += '<div class="pv" id="v' + (v + 1) + '"><div class="pvnum">' + (v + 1) + '</div><div class="pvbody">';
        for (i = 0; i < list.length; i++) {
          var nm = list[i], txt = '';
          try { txt = datas[nm].books[curBook].chapters[curChap][v] || ''; } catch (e) {}
          html += '<div class="pvrow"><span class="plabel' + (isEngVer(nm) ? ' eng' : '') + '">' +
            escapeHtml(nm) + '</span><span class="ptext">' + parText(txt) + '</span></div>';
        }
        html += '</div></div>';
      }
      contentEl.innerHTML = html;
      window.scrollTo(0, 0);
      adjustHeadSpace();
    }

    // 병행 토글
    parBtn.addEventListener('click', function () {
      if (PAR_ON) {
        PAR_ON = false; parBtn.classList.remove('on');
        parBar.style.display = 'none'; document.body.classList.remove('par');
        adjustHeadSpace();
        loadVersion(curVersion, curBook, curChap); // 단일 보기 복귀
      } else {
        PAR_ON = true; parBtn.classList.add('on');
        parBar.style.display = 'flex'; document.body.classList.add('par');
        if (BIBLE) PAR_CACHE[curVersion] = BIBLE;   // 기준 데이터 재사용
        renderParBar();
        renderParallel();                            // 기준만이라도 병행 형식으로
        if (PAR_EXTRA.length === 0) openParPick(0);   // 추가 없으면 선택창 바로
      }
    });

    // 공유(Share Target)로 받은 파일 처리 — 서비스워커가 캐시에 담아두면 여기서 임포트
    function processSharedIfAny() {
      if (location.search.indexOf('shared=1') === -1 || !('caches' in window)) return;
      caches.open('shared-incoming').then(function (cache) {
        cache.match('shared-payload.json').then(function (resp) {
          if (!resp) return;
          resp.json().then(function (payloads) {
            if (!payloads || !payloads.length) return;
            importTexts(payloads, function (res) {
              cache.delete('shared-payload.json');
              var msg = [];
              if (res.added.length) msg.push('번역본 ' + res.added.length + '개');
              if (res.lex) msg.push('원어사전');
              if (res.skipped) msg.push('중복제외 ' + res.skipped);
              toast(msg.length ? ('공유 불러오기 완료: ' + msg.join(', ')) : '불러온 파일이 없습니다');
              refreshVersions();
            });
          });
        });
      });
    }
    processSharedIfAny();
  </script>
</body>
</html>
