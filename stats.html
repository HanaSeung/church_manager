<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.json">
<title>통계 · 재정 관리</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  :root{--green:#2f6f4f; --green-soft:#e7f1ec; --green-deep:#245540;
    --bg:#f5f6f4; --card:#fff; --text:#1f2421; --muted:#6b726d; --hint:#9aa19c;
    --line:#e2e5e1;}
  html{scrollbar-gutter:stable;}
  body{font-family:'Malgun Gothic', system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.6;}
  .wrap{max-width:720px; margin:0 auto; min-height:100vh; padding-bottom:40px;}
  header{position:sticky; top:0; z-index:10; background:var(--green); color:#fff;
    display:grid; grid-template-columns:36px 1fr 36px; align-items:center; padding:14px 12px;}
  .circle{width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px; line-height:1;}
  header .title{text-align:center; font-size:17px; font-weight:600;}
  .tabs{display:flex; border-bottom:1px solid var(--line); background:var(--card);}
  .tab{flex:1; text-align:center; padding:13px 0; font-size:15px; color:var(--hint);
    cursor:pointer; border-bottom:2px solid transparent; font-weight:500;}
  .tab.on{color:var(--green); border-bottom-color:var(--green); font-weight:600;}

  .lead{padding:16px 16px 10px; font-size:12.5px; color:var(--muted);}
  .menu{padding:0 14px;}
  .item{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 14px; margin-bottom:10px; cursor:pointer; font-family:inherit; color:inherit;}
  .item:hover{border-color:var(--green); background:var(--green-soft);}
  .item .ico{width:38px; height:38px; flex:0 0 38px; border-radius:10px; background:var(--green-soft);
    display:flex; align-items:center; justify-content:center; font-size:19px;}
  .item .tx{flex:1; min-width:0;}
  .item .t1{display:block; font-size:15px; font-weight:600; line-height:1.35;}
  .item .t2{display:block; font-size:12px; color:var(--muted); line-height:1.45; margin-top:2px;}
  .item .arw{color:var(--hint); font-size:20px; line-height:1;}
  .note{padding:6px 16px 0; font-size:11.5px; color:var(--hint);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="circle" id="backBtn" aria-label="뒤로">‹</span>
    <span class="title">재정 관리</span>
    <span></span>
  </header>

  <div class="tabs">
    <div class="tab" data-go="inc">수입</div>
    <div class="tab" data-go="exp">지출</div>
    <div class="tab on">통계</div>
    <div class="tab" data-go="set">설치</div>
  </div>

  <div class="lead">보고 싶은 표를 고르세요. 회기 · 기간은 표 안에서 바꿀 수 있습니다.</div>

  <div class="menu">
    <button class="item" data-type="bs">
      <span class="ico">📋</span>
      <span class="tx">
        <span class="t1">예결산표</span>
        <span class="t2">수입부 · 특별헌금 · 이월 · 지출부 · 기금별 잔액 · 월별 내역 · 엑셀 내보내기</span>
      </span>
      <span class="arw">›</span>
    </button>
    <button class="item" data-type="monthly">
      <span class="ico">📅</span>
      <span class="tx">
        <span class="t1">년간 월별 집계표</span>
        <span class="t2">12개월 가로표 — 수입 · 지출 골라서 크게</span>
      </span>
      <span class="arw">›</span>
    </button>
    <button class="item" data-type="weekly">
      <span class="ico">🗓</span>
      <span class="tx">
        <span class="t1">월간 주별 집계표</span>
        <span class="t2">한 달 주차 가로표 — 수입 · 지출 골라서</span>
      </span>
      <span class="arw">›</span>
    </button>
    <button class="item" data-type="range">
      <span class="ico">🔍</span>
      <span class="tx">
        <span class="t1">기간 단위 검색</span>
        <span class="t2">기간 · 구분 · 항목을 골라서 조회 (수입 · 지출 따로)</span>
      </span>
      <span class="arw">›</span>
    </button>
    <button class="item" data-type="member">
      <span class="ico">👤</span>
      <span class="tx">
        <span class="t1">성도별 헌금 집계</span>
        <span class="t2">성도별 · 항목별 헌금 합계 (기부금영수증 · 심방 자료)</span>
      </span>
      <span class="arw">›</span>
    </button>
  </div>

  <div class="note" id="note"></div>
</div>
<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);
  const MIN_LEVEL = 3;

  // PC 는 표를 새 창에 띄운다(가로 제한 없이 전체화면). 폰은 새 창이 어색해서 그대로 이동한다.
  const PC = window.matchMedia('(min-width:900px)').matches;
  if (PC) $('note').textContent = '표는 새 창으로 열립니다. 창을 닫으면 이 화면으로 돌아옵니다.';

  $('backBtn').onclick = () => { location.href = 'index.html'; };
  document.querySelectorAll('[data-go]').forEach((el) => {
    el.onclick = () => { location.href = 'offering.html?tab=' + el.dataset.go; };
  });

  document.querySelectorAll('[data-type]').forEach((el) => {
    el.onclick = () => {
      const url = 'report.html?type=' + el.dataset.type;
      if (!PC) { location.href = url; return; }
      // 팝업이 차단되면 같은 탭으로 떨어뜨린다. 눌렀는데 아무 일도 안 일어나면 안 된다.
      const w = window.open(url, '_blank');
      if (!w) location.href = url;
    };
  });

  // 메뉴는 권한만 확인한다. 데이터는 각 보고서 창에서 읽는다(메뉴가 즉시 뜬다).
  onAuthStateChanged(auth, async (user) => {
    if (!user) { location.replace('index.html'); return; }
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      const lv = snap.exists() ? (snap.data().level || 1) : 1;
      if (lv < MIN_LEVEL) { alert('통계는 재정 담당자만 이용할 수 있습니다.'); location.replace('index.html'); }
    } catch (e) {
      console.error(e);
    }
  });
</script>
</body>
</html>
