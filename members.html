<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6f4f">
  <link rel="manifest" href="manifest.json">
  <title>성도 관리 · 예닮교회</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green: #2f6f4f; --green-soft: #e7f1ec; --green-deep: #245540;
      --bg: #f5f6f4; --card: #ffffff;
      --text: #1f2421; --muted: #6b726d; --line: #e2e5e1;
      --danger: #c0392b; --amber-soft: #fbeed9; --amber-text: #946400;
    }
    body { font-family: 'Malgun Gothic', system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 0 90px; min-height: 100vh; }
    .empty { text-align:center; color:var(--muted); font-size:14px; padding:48px 16px; }
    .ftab { border:1px solid var(--line); background:var(--card); padding:6px 16px;
      font-size:13px; color:var(--muted); cursor:pointer; border-radius:99px; font-family:inherit; }
    .ftab-on { background:var(--green); color:#fff; border-color:var(--green); }
    .mrow { display:flex; align-items:center; gap:12px; padding:11px 4px;
      border-top:1px solid var(--line); cursor:pointer; }
    .mrow:first-child { border-top:none; }
    .mrow:active { background:var(--green-soft); }
    .avatar { width:42px; height:42px; border-radius:50%; flex-shrink:0; display:flex;
      align-items:center; justify-content:center; font-weight:700; font-size:16px;
      background:var(--green-soft); color:var(--green); }
    .badge { font-size:11px; padding:1px 8px; border-radius:99px;
      background:var(--green-soft); color:var(--green-deep); flex-shrink:0; }
    .badge-new { background:var(--amber-soft); color:var(--amber-text); }
  </style>
  <style>
    .field { margin-bottom:12px; }
    .field > label { display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
    .req { color:var(--danger); }
    .field input, .field select, .field textarea, .frow input, .frow select {
      width:100%; height:42px; padding:0 12px; border:1px solid var(--line); border-radius:8px;
      font-size:14px; background:var(--card); color:var(--text); font-family:inherit; }
    .field textarea { height:auto; padding:11px 12px; resize:vertical; line-height:1.6; }
    .frow { display:flex; gap:10px; margin-bottom:12px; }
    .frow > .field { flex:1; margin-bottom:0; }
    .btn-line { height:42px; padding:0 12px; border:1px solid var(--green); background:transparent;
      color:var(--green); border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
      white-space:nowrap; font-family:inherit; flex-shrink:0; }
    .hint { font-size:11.5px; color:var(--muted); margin-top:6px; }
    .hint.ok { color:var(--green); }
    .hint.warn { color:var(--danger); }
    .field input.invalid, .field select.invalid { border-color:var(--danger)!important; box-shadow:0 0 0 2px rgba(217,48,37,.14); }
    .ferr { display:none; font-size:11.5px; color:var(--danger); margin-top:5px; }
    .ferr.show { display:block; }
    .crow { display:flex; gap:10px; margin-bottom:12px; }
    .crow > .field { flex:1; min-width:0; margin-bottom:0; }
    .crow > .field.efield { flex:1.6; }
    @media (max-width:560px) {
      .crow { flex-direction:column; gap:12px; }
      .crow > .field, .crow > .field.efield { flex:none; }
    }
    .nrow { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin-bottom:12px; }
    .nrow .vdiv { align-self:flex-end; height:42px; width:0; border-left:1px solid var(--line); margin:0 3px; flex-shrink:0; }
    @media (max-width:560px) { .nrow .vdiv { display:none; } }
    .headno { flex-shrink:0; align-self:center; min-width:38px; height:42px; display:none;
      align-items:center; justify-content:center; padding:0 8px; background:var(--green-soft);
      color:var(--green-deep); border-radius:8px; font-size:12.5px; font-weight:700; }
    .pray-row { border:1px solid var(--line); border-radius:8px; margin-bottom:6px; background:var(--card); }
    .pray-full { padding:2px 11px 11px 40px; font-size:13px; color:var(--muted); line-height:1.6; white-space:pre-wrap; }
    .family { background:var(--green-soft); border-radius:9px; padding:11px 12px; margin-bottom:12px; }
    .family > .lbl { font-size:13px; color:var(--muted); margin-bottom:7px; }
    .agebox { width:62px; flex-shrink:0; height:42px; background:var(--bg); border-radius:8px;
      display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; }
    .acc { border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; }
    .acc-head { display:flex; align-items:center; justify-content:space-between;
      background:var(--bg); padding:13px 14px; cursor:pointer; user-select:none; }
    .acc-head .h-t { font-size:14.5px; font-weight:700; color:var(--green-deep); }
    .acc-head .h-s { font-size:12px; color:var(--muted); }
    .acc-body { padding:14px 13px; display:none; }
    .acc.open .acc-body { display:block; }
    .acc.open .chev { transform:rotate(90deg); }
    .acc.open .acc-head { border-bottom:1px solid var(--line); }
    .chev { display:inline-block; transition:transform .2s; font-size:12px; }
    .save { width:100%; height:48px; margin-top:14px; background:var(--green); color:#fff;
      border:none; border-radius:9px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
    .drow { display:flex; padding:10px 0; border-top:1px solid var(--line); font-size:14.5px; }
    .drow .dk { color:var(--muted); width:84px; flex-shrink:0; }
    .drow .dv { flex:1; }
    .dsec { font-size:12px; font-weight:700; color:var(--green); margin:18px 0 2px; }
    .pickbk { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:1000;
      display:none; align-items:flex-end; justify-content:center; }
    .pickbk.on { display:flex; }
    .pick { background:var(--card); width:100%; max-width:720px; border-radius:14px 14px 0 0;
      max-height:70vh; display:flex; flex-direction:column; }
    .pickrow { padding:13px 16px; border-top:1px solid var(--line); cursor:pointer; font-size:15px; }
    .pickrow:active { background:var(--green-soft); }
    ::placeholder { color:#b3b8b3; }
    input:focus, select:focus, textarea:focus { outline:none; border-color:var(--green); }
    @media (max-width:760px) { #fab { right:16px; } }
  </style>
</head>
<body>
  <div class="wrap">

    <header style="position:sticky; top:0; z-index:10; background:var(--card);
      display:flex; align-items:center; gap:12px; padding:14px 16px;
      border-bottom:1px solid var(--line);">
      <span id="backBtn" style="color:var(--muted); font-size:22px; line-height:1;
        display:flex; align-items:center; cursor:pointer;" aria-label="뒤로">‹</span>
      <div id="barTitle" style="font-size:18px; font-weight:700; flex:1;">성도 관리</div>
      <button id="editBtn" style="display:none; border:none; background:none; color:var(--green);
        font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;">편집</button>
    </header>

    <!-- ===== 목록 ===== -->
    <div id="listView">
      <div style="padding:12px 14px 0;">
        <div style="display:flex; align-items:center; gap:8px; background:var(--bg);
          border:1px solid var(--line); border-radius:10px; padding:9px 12px;">
          <span style="color:var(--muted); font-size:15px;">🔍</span>
          <input id="searchInput" type="text" placeholder="이름·연락처 검색"
            style="flex:1; border:none; background:none; font-size:14px; color:var(--text); font-family:inherit;">
        </div>
      </div>
      <div style="display:flex; gap:6px; padding:12px 14px 4px; align-items:center;">
        <button class="ftab ftab-on" data-filter="all">전체</button>
        <button class="ftab" data-filter="new">새가족</button>
        <button id="assignNoBtn" class="btn-line" style="margin-left:auto; font-size:12px; padding:5px 10px;">번호 일괄 부여</button>
      </div>
      <div id="memberList" style="padding:4px 14px;">
        <div class="empty">불러오는 중…</div>
      </div>
    </div>

    <!-- ===== 상세 ===== -->
    <div id="detailView" style="display:none; padding:18px 16px;"></div>

    <!-- ===== 추가/편집 ===== -->
    <div id="editView" style="display:none; padding:12px 13px;">

      <!-- 1. 기본정보 -->
      <div class="acc open" id="acc1">
        <div class="acc-head" data-acc="acc1"><span class="h-t">1. 기본정보</span><span class="h-s">접기 <span class="chev">›</span></span></div>
        <div class="acc-body">
          <div class="nrow">
            <div class="field" style="flex:1.4 1 120px; min-width:0; margin-bottom:0;">
              <label>이름 <span class="req">*</span></label>
              <input id="fName" type="text" placeholder="홍길동" style="width:100%; min-width:0;">
            </div>
            <button class="btn-line" id="dupBtn" style="align-self:flex-end; height:42px; padding:0 10px;">동명이인</button>
            <div class="field" style="width:62px; flex-shrink:0; margin-bottom:0;">
              <label>성별</label>
              <select id="fGender" style="padding:0 8px;">
                <option value="">-</option><option>남</option><option>여</option>
              </select>
            </div>
            <div class="vdiv"></div>
            <div class="field" style="flex:1.3 1 120px; min-width:0; margin-bottom:0;">
              <label>생일</label>
              <input id="fBirth" type="text" placeholder="19880312" inputmode="numeric" style="width:100%; min-width:0;">
            </div>
            <div class="field" style="width:74px; flex-shrink:0; margin-bottom:0;">
              <label>양력/음력</label>
              <select id="fBirthCal" style="padding:0 6px;">
                <option value="solar">양력</option><option value="lunar">음력</option><option value="unknown">모름</option>
              </select>
            </div>
            <div class="field" style="width:54px; flex-shrink:0; margin-bottom:0;">
              <label>나이</label>
              <div class="agebox" id="ageBox" style="width:54px;">–</div>
            </div>
          </div>
          <div class="hint" id="dupHint"></div>
          <div class="family">
            <div class="lbl">👪 신앙세대주 / 관계</div>
            <div style="display:flex; gap:7px; align-items:center;">
              <span id="headNoBadge" class="headno"></span>
              <input id="fHead" type="text" placeholder="세대주 이름" style="flex:1; min-width:0; height:42px; padding:0 12px; background:var(--card);">
              <button class="btn-line" id="headBtn" style="padding:0 11px;">검색</button>
              <select id="fRel" style="width:82px; flex-shrink:0; height:42px; background:var(--card); padding:0 8px;">
                <option value="">관계</option>
                <option>본인</option><option>남편</option><option>처</option>
                <option>아버지</option><option>어머니</option><option>시부</option><option>시모</option><option>장모</option><option>장인</option>
                <option>할아버지</option><option>할머니</option>
                <option>아들1</option><option>아들2</option><option>아들3</option><option>아들4</option><option>아들5</option>
                <option>딸1</option><option>딸2</option><option>딸3</option><option>딸4</option><option>딸5</option>
                <option>자부1</option><option>자부2</option><option>자부3</option>
                <option>사위1</option><option>사위2</option><option>사위3</option>
                <option>손녀사위</option><option>손부</option>
                <option>손녀1</option><option>손녀2</option><option>손녀3</option>
                <option>손자1</option><option>손자2</option><option>손자3</option>
                <option>형</option><option>언니</option><option>누나</option><option>오빠</option><option>남동생</option><option>여동생</option>
                <option>삼촌</option><option>조카</option><option>고모</option><option>고모부</option><option>이모</option><option>이모부</option>
                <option>처형</option><option>처남</option><option>동서</option><option>동거인</option>
              </select>
            </div>
          </div>
          <div class="crow">
            <div class="field">
              <label>휴대폰</label>
              <input id="fPhone" type="tel" placeholder="010-0000-0000" inputmode="numeric">
              <div class="ferr" id="ePhoneErr">휴대폰 형식이 올바르지 않습니다.</div>
            </div>
            <div class="field">
              <label>집전화</label>
              <input id="fPhoneHome" type="tel" placeholder="055-000-0000" inputmode="numeric">
              <div class="ferr" id="ePhoneHomeErr">집전화 형식이 올바르지 않습니다.</div>
            </div>
            <div class="field efield">
              <label>이메일</label>
              <div style="display:flex; align-items:center; gap:7px;">
                <input id="fEmailId" type="text" placeholder="아이디" style="flex:1; min-width:0;" autocomplete="off">
                <span style="color:var(--muted); flex-shrink:0;">@</span>
                <input id="fEmailCustom" type="text" placeholder="도메인 입력" style="flex:1; min-width:0; display:none;" autocomplete="off">
                <select id="fEmailDomain" style="flex:1; min-width:0;">
                  <option value="naver.com">naver.com</option>
                  <option value="gmail.com">gmail.com</option>
                  <option value="daum.net">daum.net</option>
                  <option value="hanmail.net">hanmail.net</option>
                  <option value="nate.com">nate.com</option>
                  <option value="__custom">직접 입력</option>
                </select>
              </div>
              <div class="ferr" id="eEmailErr">이메일 형식이 올바르지 않습니다.</div>
            </div>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>주소</label>
            <div style="display:flex; gap:7px; margin-bottom:7px;">
              <input id="fZip" type="text" placeholder="우편번호" readonly style="width:100px; flex-shrink:0; background:var(--bg);">
              <button type="button" id="fZipBtn" class="btn-line">우편번호 찾기</button>
            </div>
            <input id="fAddress" type="text" placeholder="도로명 주소" readonly style="margin-bottom:7px; background:var(--bg);">
            <input id="fAddressDetail" type="text" placeholder="상세주소 (동·호수)">
          </div>
        </div>
      </div>

      <!-- 2. 등록정보 -->
      <div class="acc" id="acc2">
        <div class="acc-head" data-acc="acc2"><span class="h-t">2. 등록정보</span><span class="h-s">펼치기 <span class="chev">›</span></span></div>
        <div class="acc-body">
          <div class="frow">
            <div class="field"><label>등록일</label><input id="fRegDate" type="date"></div>
            <div class="field"><label>등록배경</label>
              <select id="fRegType"><option value="">선택</option><option>전도</option><option>스스로</option><option>기관사역을 통해</option></select>
            </div>
          </div>
          <div class="frow">
            <div class="field"><label>인도자</label><input id="fGuide" type="text" placeholder="전도한 분"></div>
            <div class="field"><label>이전 교회</label><input id="fPrev" type="text" placeholder="○○교회"></div>
          </div>
          <div class="frow">
            <div class="field"><label>신급</label>
              <select id="fGrade"><option value="">선택</option><option>원입</option><option>학습</option><option>세례</option><option>입교</option><option>유아세례</option></select>
            </div>
            <div class="field"><label>신급일</label><input id="fGradeDate" type="month"></div>
          </div>
          <div class="frow" style="margin-bottom:0;">
            <div class="field"><label>신급교회</label><input id="fGradeChurch" type="text" placeholder="신급 받은 교회"></div>
            <div class="field"><label>집례자</label><input id="fOfficiant" type="text" placeholder="집례 목사"></div>
          </div>
        </div>
      </div>

      <!-- 3. 신앙정보 -->
      <div class="acc" id="acc3">
        <div class="acc-head" data-acc="acc3"><span class="h-t">3. 신앙정보</span><span class="h-s">펼치기 <span class="chev">›</span></span></div>
        <div class="acc-body">
          <div class="field"><label>직분</label><select id="fRole"></select></div>
          <div class="frow" style="margin-bottom:0;">
            <div class="field"><label>교인구분</label>
              <select id="fType"><option selected>교인</option><option>새가족</option><option>타교인</option><option>타종교</option><option>별세</option><option>성도</option></select>
            </div>
            <div class="field"><label>현재 상태</label>
              <select id="fStatus"><option selected>예배출석</option><option>가끔출석</option><option>군입대</option><option>유학</option><option>불출석</option></select>
            </div>
          </div>
        </div>
      </div>

      <!-- 4. 가족관계 -->
      <div class="acc" id="acc4">
        <div class="acc-head" data-acc="acc4"><span class="h-t">4. 가족관계</span><span class="h-s">펼치기 <span class="chev">›</span></span></div>
        <div class="acc-body">
          <div class="frow">
            <div class="field"><label>결혼관계</label>
              <select id="fMarriage"><option value="">선택</option><option>미혼</option><option>기혼</option><option>이별</option><option>사별</option><option>재혼</option><option>별거</option></select>
            </div>
            <div class="field"><label>결혼일</label><input id="fWed" type="month"></div>
          </div>
          <div class="field" style="margin-bottom:0;"><label>배우자</label>
            <div style="display:flex; gap:8px;">
              <input id="fSpouse" type="text" placeholder="배우자 이름" style="flex:1;">
              <button class="btn-line" id="spouseBtn">명부 검색</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 5. 기타 -->
      <div class="acc" id="acc5">
        <div class="acc-head" data-acc="acc5"><span class="h-t">5. 기타</span><span class="h-s">펼치기 <span class="chev">›</span></span></div>
        <div class="acc-body">
          <div class="field"><label>개인 사진</label>
            <input id="fPhoto" type="file" accept="image/*" disabled style="padding:9px 12px;">
            <div class="hint">저장소(NAS/Firebase) 결정 후 업로드가 연결됩니다. (현재 비활성)</div>
          </div>
          <div class="field"><label>메모</label><textarea id="fMemo" rows="3" placeholder="자유롭게 기록"></textarea></div>
          <div class="field" style="margin-bottom:0;">
            <label>기도제목 (날짜별)</label>
            <div style="display:flex; gap:6px; margin-bottom:8px;">
              <input id="fPrayDate" type="date" style="width:150px; flex-shrink:0;">
              <input id="fPrayText" type="text" placeholder="기도제목 내용" style="flex:1; min-width:0;">
              <button class="btn-line" id="prayAddBtn" style="padding:0 14px;">추가</button>
            </div>
            <div id="prayList"></div>
            <div id="prayMoreWrap" style="text-align:center; margin-top:8px; display:none;">
              <button class="btn-line" id="prayMoreBtn" style="padding:6px 20px;">더 보기</button>
            </div>
          </div>
        </div>
      </div>

      <div id="editMsg" style="display:none; font-size:13px; color:var(--danger); margin:8px 2px 0;"></div>
      <div style="display:flex; gap:8px; margin-top:14px;">
        <button id="eCancel" class="btn-line" style="flex:1; height:48px; border-color:var(--line); color:var(--text);">취소</button>
        <button id="eSave" class="save" style="flex:1; margin-top:0;">저장</button>
      </div>
    </div>

  </div>

  <button id="fab" style="position:fixed; right:max(16px, calc(50% - 360px + 16px)); bottom:22px;
    width:54px; height:54px; border-radius:50%; border:none; background:var(--green);
    color:#fff; font-size:30px; line-height:1; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.22);
    display:flex; align-items:center; justify-content:center;" aria-label="성도 추가">＋</button>

  <!-- 명부 검색 오버레이 (세대주/배우자) -->
  <div class="pickbk" id="pickBk">
    <div class="pick">
      <div style="padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center;">
        <input id="pickInput" type="text" placeholder="이름 검색" style="flex:1; height:40px; padding:0 12px; border:1px solid var(--line); border-radius:8px; font-size:15px; font-family:inherit;">
        <span id="pickClose" style="font-size:14px; color:var(--muted); cursor:pointer;">닫기</span>
      </div>
      <div id="pickList" style="overflow:auto;"></div>
    </div>
  </div>

  <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import {
      collection, addDoc, getDoc, getDocs, doc, deleteDoc,
      updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const $ = (id) => document.getElementById(id);
    let me = { uid: null, name: '', level: 1 };
    let allMembers = [];
    let currentFilter = 'all';
    let editingId = null;
    let detailId = null;
    let overlayPushed = false;
    // 편집 중 선택된 참조(세대주/배우자)의 문서 id
    let pickHeadId = null, pickSpouseId = null;

    const ROLES = ['목사', '전도사', '장로', '권사', '안수집사', '서리집사', '성도'];

    const esc = (s) => (s || '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const initial = (name) => (name || '?').trim().charAt(0) || '?';
    const dot = (s) => (s || '').replace(/-/g, '.');

    function calcAge(birth) {
      const m = (birth || '').trim().match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})$/);
      if (!m) return null;
      const by = +m[1], bm = +m[2], bd = +m[3];
      const t = new Date();
      let age = t.getFullYear() - by;
      if ((t.getMonth() + 1) < bm || ((t.getMonth() + 1) === bm && t.getDate() < bd)) age--;
      return (age >= 0 && age < 130) ? age : null;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.replace('index.html'); return; }
      try {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const lv = snap.exists() ? (snap.data().level || 1) : 1;
        if (lv < 4) { alert('성도 관리는 관리자만 이용할 수 있습니다.'); location.replace('index.html'); return; }
        me = { uid: user.uid, name: (snap.data().name || user.displayName || '관리자'), level: lv };
        $('fRole').innerHTML = ROLES.map((r) => `<option${r === '성도' ? ' selected' : ''}>${r}</option>`).join('');
        loadMembers();
      } catch (e) {
        alert('정보를 불러오지 못했습니다. 다시 시도해 주세요.');
        location.replace('index.html');
      }
    });

    // 회원번호: 현재 최댓값 + 1 (없으면 1부터)
    function nextMemberNo() {
      let mx = 0;
      allMembers.forEach((m) => {
        const n = Number(m.memberNo);
        if (Number.isFinite(n) && n > mx) mx = n;
      });
      return mx + 1;
    }

    // 회원번호가 없는 성도에게 등록순(createdAt)으로 번호 일괄 부여
    async function assignAllMemberNos() {
      const has = (m) => Number.isFinite(Number(m.memberNo)) && Number(m.memberNo) > 0;
      const missing = allMembers.filter((m) => !has(m));
      if (missing.length === 0) { alert('모든 성도에게 이미 회원번호가 있습니다.'); return; }
      if (!confirm(`회원번호가 없는 성도 ${missing.length}명에게 등록순으로 번호를 부여할까요?`)) return;
      const ts = (m) => (m.createdAt && m.createdAt.seconds) ? m.createdAt.seconds : Number.MAX_SAFE_INTEGER;
      missing.sort((a, b) => ts(a) - ts(b));
      let start = 0;
      allMembers.forEach((m) => { const n = Number(m.memberNo); if (Number.isFinite(n) && n > start) start = n; });
      const btn = $('assignNoBtn');
      btn.disabled = true; btn.textContent = '부여 중…';
      try {
        let no = start;
        for (const m of missing) {
          no += 1;
          await updateDoc(doc(db, 'members', m.id), { memberNo: no });
        }
        await loadMembers();
        alert(`${missing.length}명에게 회원번호를 부여했습니다. (${start + 1}~${no}번)`);
      } catch (e) {
        alert('번호 부여 실패: ' + (e.code || e.message));
      } finally {
        btn.disabled = false; btn.textContent = '번호 일괄 부여';
      }
    }

    async function loadMembers() {
      try {
        const qs = await getDocs(collection(db, 'members'));
        allMembers = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
        allMembers.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));
        renderList();
      } catch (e) {
        $('memberList').innerHTML = `<div class="empty">불러오지 못했습니다.<br>(${esc(e.code || e.message)})</div>`;
      }
    }

    function renderList() {
      const kw = $('searchInput').value.trim().toLowerCase();
      let rows = allMembers;
      if (currentFilter === 'new') rows = rows.filter((m) => m.memberType === '새가족');
      if (kw) rows = rows.filter((m) =>
        (m.name || '').toLowerCase().includes(kw) || (m.phone || '').includes(kw));

      if (rows.length === 0) {
        $('memberList').innerHTML = `<div class="empty">${(kw || currentFilter === 'new') ? '해당하는 성도가 없습니다.' : '아직 등록된 성도가 없습니다.<br>＋ 버튼으로 추가하세요.'}</div>`;
        return;
      }
      $('memberList').innerHTML = '';
      rows.forEach((m) => {
        const row = document.createElement('div');
        row.className = 'mrow';
        const isNew = m.memberType === '새가족';
        const sub = m.phone || (m.address ? m.address : '연락처 없음');
        row.innerHTML =
          `<div class="avatar">${esc(initial(m.name))}</div>
           <div style="flex:1; min-width:0;">
             <div style="display:flex; align-items:center; gap:7px;">
               ${Number.isFinite(Number(m.memberNo)) && Number(m.memberNo) > 0 ? `<span style="font-size:12px; color:var(--muted); flex-shrink:0;">#${Number(m.memberNo)}</span>` : ''}
               <span style="font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(m.name || '(이름 없음)')}</span>
               ${m.role ? `<span class="badge">${esc(m.role)}</span>` : ''}
               ${isNew ? '<span class="badge badge-new">새가족</span>' : ''}
             </div>
             <div style="font-size:13px; color:var(--muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(sub)}</div>
           </div>
           <span style="color:#c4c9c4; font-size:18px;">›</span>`;
        row.addEventListener('click', () => openDetail(m.id));
        $('memberList').appendChild(row);
      });
    }

    $('searchInput').addEventListener('input', renderList);
    document.querySelectorAll('.ftab').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.ftab').forEach((x) => x.classList.remove('ftab-on'));
        b.classList.add('ftab-on');
        currentFilter = b.dataset.filter;
        renderList();
      });
    });

    $('assignNoBtn').addEventListener('click', assignAllMemberNos);

    const BADGE_GRADE = (m) => {
      if (!m.grade) return '';
      return m.grade + (m.gradeDate ? ' · ' + dot(m.gradeDate) : '');
    };
    function drow(k, v) {
      if (!v) return '';
      return `<div class="drow"><div class="dk">${k}</div><div class="dv">${v}</div></div>`;
    }
    function householdMembers(m) {
      if (!m.householdId) return [];
      return allMembers.filter((x) => x.householdId === m.householdId)
        .sort((a, b) => (a.relation === '본인(세대주)' ? -1 : 0) - (b.relation === '본인(세대주)' ? -1 : 0));
    }

    function openDetail(id) {
      const m = allMembers.find((x) => x.id === id);
      if (!m) return;
      detailId = id;
      const age = calcAge(m.birth);
      const top = [m.gender, (age != null ? age + '세' : null), m.memberType, m.status].filter(Boolean).join(' · ');
      const birthTxt = m.birth ? (esc(m.birth) + (m.birthCal === 'lunar' ? ' (음)' : '') + (age != null ? ` · 만 ${age}세` : '')) : '';

      const fam = householdMembers(m);
      let famHtml = '';
      if (fam.length > 1 || (m.relation && m.relation !== '')) {
        const chips = fam.map((x) =>
          `<span style="font-size:12.5px; padding:4px 10px; border-radius:99px; background:var(--bg);">${esc(x.name)}${x.relation ? ' · ' + esc(x.relation.replace('(세대주)', '')) : ''}</span>`).join(' ');
        famHtml = `<div style="margin-top:10px;"><div style="font-size:12px; color:var(--muted); margin-bottom:7px;">가정 구성원</div><div style="display:flex; gap:7px; flex-wrap:wrap;">${chips || '—'}</div></div>`;
      }

      $('detailView').innerHTML =
        `<div style="display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:8px;">
           <div class="avatar" style="width:72px; height:72px; font-size:26px;">${esc(initial(m.name))}</div>
           <div style="text-align:center;">
             <div style="font-size:19px; font-weight:700;">${esc(m.name || '(이름 없음)')}
               ${m.role ? `<span class="badge" style="vertical-align:3px;">${esc(m.role)}</span>` : ''}
               ${m.memberType === '새가족' ? '<span class="badge badge-new" style="vertical-align:3px;">새가족</span>' : ''}
             </div>
             <div style="font-size:13px; color:var(--muted); margin-top:3px;">${esc(top)}</div>
           </div>
         </div>

         <div class="dsec">기본</div>
         ${drow('휴대폰', m.phone ? `<a href="tel:${esc(m.phone)}" style="color:var(--green); text-decoration:none;">${esc(m.phone)}</a>` : '')}
         ${drow('집전화', m.phoneHome ? `<a href="tel:${esc(m.phoneHome)}" style="color:var(--green); text-decoration:none;">${esc(m.phoneHome)}</a>` : '')}
         ${drow('생일', birthTxt)}
         ${drow('이메일', esc(m.email))}
         ${drow('주소', esc([m.zipcode ? '(' + m.zipcode + ')' : '', m.address, m.addressDetail].filter(Boolean).join(' ')))}

         <div class="dsec">등록</div>
         ${drow('등록일', esc(dot(m.regDate)))}
         ${drow('등록배경', esc(m.regType))}
         ${drow('인도자', esc(m.guide))}
         ${drow('이전교회', esc(m.prevChurch))}
         ${drow('신급', esc(BADGE_GRADE(m)))}
         ${drow('신급교회', esc(m.gradeChurch))}
         ${drow('집례자', esc(m.officiant))}

         <div class="dsec">가족</div>
         ${drow('결혼관계', esc(m.marriage))}
         ${drow('결혼일', esc(dot(m.wedDate)))}
         ${drow('배우자', esc(m.spouseName))}
         ${famHtml}

         ${m.memo ? `<div class="dsec">메모</div><div style="font-size:14px; color:var(--text); white-space:pre-wrap; padding-top:6px;">${esc(m.memo)}</div>` : ''}
         ${(Array.isArray(m.prayers) && m.prayers.length) ? `<div class="dsec">기도제목</div>${[...m.prayers].sort((a, b) => (b.date || '').localeCompare(a.date || '')).map((p) => `<div style="padding:7px 0; border-top:1px solid var(--line);"><span style="font-size:12px; color:var(--muted); margin-right:8px;">${esc(p.date || '')}</span><span style="font-size:14px; color:var(--text); white-space:pre-wrap;">${esc(p.text || '')}</span></div>`).join('')}` : ''}

         <button id="dDelete" class="btn-line" style="width:100%; height:46px; margin-top:22px; color:var(--danger); border-color:#e7c9c4;">삭제</button>`;
      $('dDelete').addEventListener('click', () => removeMember(id));
      show('detail');
    }

    function setAcc(open1) {
      ['acc1', 'acc2', 'acc3', 'acc4', 'acc5'].forEach((a, i) => {
        const el = $(a);
        if (i === 0 && open1) el.classList.add('open'); else el.classList.remove('open');
        const s = el.querySelector('.h-s');
        s.firstChild.textContent = el.classList.contains('open') ? '접기 ' : '펼치기 ';
      });
    }

    function openEdit(id) {
      editingId = id;
      const m = id ? allMembers.find((x) => x.id === id) : null;
      $('fName').value = m?.name || '';
      $('fGender').value = m?.gender || '';
      $('fBirth').value = m?.birth || '';
      $('fBirthCal').value = m?.birthCal || 'solar';
      $('fPhone').value = fmtPhone(m?.phone || '');
      $('fPhone').classList.remove('invalid'); $('ePhoneErr').classList.remove('show');
      $('fPhoneHome').value = fmtPhone(m?.phoneHome || '');
      $('fPhoneHome').classList.remove('invalid'); $('ePhoneHomeErr').classList.remove('show');
      $('fZip').value = m?.zipcode || '';
      $('fAddress').value = m?.address || '';
      $('fAddressDetail').value = m?.addressDetail || '';
      setEmailFields(m?.email || '');
      $('fRegDate').value = m?.regDate || new Date().toISOString().slice(0, 10);
      $('fRegType').value = m?.regType || '';
      $('fGuide').value = m?.guide || '';
      $('fPrev').value = m?.prevChurch || '';
      $('fGrade').value = m?.grade || '';
      $('fGradeDate').value = m?.gradeDate || '';
      $('fGradeChurch').value = m?.gradeChurch || '';
      $('fOfficiant').value = m?.officiant || '';
      $('fRole').value = m?.role || '성도';
      $('fType').value = m?.memberType || '교인';
      $('fStatus').value = m?.status || '예배출석';
      $('fHead').value = m?.headName || '';
      $('fRel').value = m?.relation || '';
      $('fMarriage').value = m?.marriage || '';
      $('fWed').value = m?.wedDate || '';
      $('fSpouse').value = m?.spouseName || '';
      $('fMemo').value = m?.memo || '';
      loadPrayers(m?.prayers);
      pickHeadId = m?.headId || null;
      pickSpouseId = m?.spouseId || null;
      const _headM = m?.headId ? allMembers.find((x) => x.id === m.headId) : null;
      setHeadBadge(_headM ? _headM.memberNo : null);
      $('dupHint').className = 'hint'; $('dupHint').textContent = '';
      $('editMsg').style.display = 'none';
      updateAge();
      setAcc(true);
      show('edit');
    }

    // 생일 자동 하이픈: 8자리→YYYY-MM-DD, 4자리→MM-DD(연도 모름)
    function fmtBirth(v) {
      const d = (v || '').replace(/\D/g, '').slice(0, 8);
      if (d.length <= 4) return d;
      if (d.length <= 6) return d.slice(0, 4) + '-' + d.slice(4);
      return d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8);
    }
    function fmtBirthBlur(v) {
      const d = (v || '').replace(/\D/g, '');
      if (d.length === 4) return d.slice(0, 2) + '-' + d.slice(2);
      return fmtBirth(v);
    }
    function updateAge() {
      const a = calcAge($('fBirth').value);
      $('ageBox').textContent = (a != null) ? (a + '세') : '–';
    }
    $('fBirth').addEventListener('input', (e) => { e.target.value = fmtBirth(e.target.value); updateAge(); });
    $('fBirth').addEventListener('blur', (e) => { e.target.value = fmtBirthBlur(e.target.value); updateAge(); });

    // ── 기도제목 (날짜별) ──
    let prayers = [];          // [{date, text}]
    let prayShow = 3;          // 표시 개수
    let prayEdit = -1;         // 인라인 수정 중 원본 인덱스
    let prayOpen = new Set();  // 펼쳐진 원본 인덱스
    function prayToday() { return new Date().toISOString().slice(0, 10); }
    function sortedPrayers() {
      return prayers.map((p, i) => ({ p, i })).sort((a, b) => (b.p.date || '').localeCompare(a.p.date || ''));
    }
    function renderPrayers() {
      const list = $('prayList'); const arr = sortedPrayers();
      if (arr.length === 0) {
        list.innerHTML = '<div class="hint" style="margin-top:0;">등록된 기도제목이 없습니다.</div>';
        $('prayMoreWrap').style.display = 'none'; return;
      }
      const shown = arr.slice(0, prayShow);
      list.innerHTML = shown.map(({ p, i }) => {
        if (prayEdit === i) {
          return `<div class="pray-row"><div style="display:flex; gap:6px; align-items:center; padding:7px 9px;">
            <input type="date" id="prayEditDate" value="${esc(p.date || '')}" style="width:148px; flex-shrink:0; height:38px;">
            <input type="text" id="prayEditText" value="${esc(p.text || '')}" style="flex:1; min-width:0; height:38px;">
            <button class="btn-line" data-act="savep" data-i="${i}" style="padding:0 10px; height:38px;">확인</button>
            <button class="btn-line" data-act="cancelp" style="padding:0 10px; height:38px;">취소</button>
          </div></div>`;
        }
        const open = prayOpen.has(i);
        const first = esc((p.text || '').split('\n')[0]);
        return `<div class="pray-row"><div style="display:flex; align-items:center; gap:8px; padding:9px 10px;">
          <span class="pray-tog" data-i="${i}" style="cursor:pointer; color:var(--muted); width:14px; flex-shrink:0; text-align:center;">${open ? '▾' : '▸'}</span>
          <span style="font-size:12px; color:var(--muted); width:74px; flex-shrink:0;">${esc(p.date || '')}</span>
          <span class="pray-tog" data-i="${i}" style="flex:1; min-width:0; font-size:13px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${first}</span>
          <button class="btn-line" data-act="editp" data-i="${i}" style="padding:2px 8px; font-size:12px;">수정</button>
          <button class="btn-line" data-act="delp" data-i="${i}" style="padding:2px 8px; font-size:12px;">삭제</button>
        </div>${open ? `<div class="pray-full">${esc(p.text || '')}</div>` : ''}</div>`;
      }).join('');
      if (arr.length > 3) {
        $('prayMoreWrap').style.display = 'block';
        $('prayMoreBtn').textContent = (prayShow >= arr.length) ? '접기' : '더 보기';
      } else { $('prayMoreWrap').style.display = 'none'; }
    }
    function loadPrayers(src) {
      prayers = Array.isArray(src) ? src.map((p) => ({ date: p.date || '', text: p.text || '' })) : [];
      prayShow = 3; prayEdit = -1; prayOpen = new Set();
      $('fPrayDate').value = prayToday(); $('fPrayText').value = '';
      renderPrayers();
    }
    $('prayAddBtn').addEventListener('click', () => {
      const t = $('fPrayText').value.trim();
      if (!t) { alert('기도제목 내용을 입력하세요.'); return; }
      prayers.push({ date: $('fPrayDate').value || prayToday(), text: t });
      $('fPrayText').value = ''; $('fPrayDate').value = prayToday();
      renderPrayers();
    });
    $('prayMoreBtn').addEventListener('click', () => {
      const total = prayers.length;
      if (prayShow >= total) prayShow = 3;
      else if (prayShow < 5) prayShow = 5;
      else if (prayShow < 10) prayShow = 10;
      else prayShow = total;
      renderPrayers();
    });
    $('prayList').addEventListener('click', (e) => {
      const tog = e.target.closest('.pray-tog');
      if (tog) { const i = +tog.dataset.i; prayOpen.has(i) ? prayOpen.delete(i) : prayOpen.add(i); renderPrayers(); return; }
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      const i = btn.dataset.i != null ? +btn.dataset.i : -1;
      if (act === 'editp') { prayEdit = i; renderPrayers(); }
      else if (act === 'cancelp') { prayEdit = -1; renderPrayers(); }
      else if (act === 'savep') {
        const t = $('prayEditText').value.trim();
        if (!t) { alert('기도제목 내용을 입력하세요.'); return; }
        prayers[i] = { date: $('prayEditDate').value || prayToday(), text: t };
        prayEdit = -1; renderPrayers();
      } else if (act === 'delp') {
        if (!confirm('이 기도제목을 삭제할까요?')) return;
        prayers.splice(i, 1); prayEdit = -1; prayOpen = new Set(); renderPrayers();
      }
    });

    $('dupBtn').addEventListener('click', () => {
      const name = $('fName').value.trim();
      const h = $('dupHint');
      if (!name) { h.className = 'hint warn'; h.textContent = '먼저 이름을 입력하세요.'; return; }
      const hit = allMembers.filter((x) => x.name === name && x.id !== editingId);
      if (hit.length) { h.className = 'hint warn'; h.textContent = `⚠ 명부에 「${name}」 님이 이미 ${hit.length}명 있습니다. 동명이인인지 확인하세요.`; }
      else { h.className = 'hint ok'; h.textContent = '✓ 같은 이름이 없습니다.'; }
    });

    // ── 명부 검색 오버레이 ──
    let pickTarget = null;
    function openPicker(target, kw) {
      pickTarget = target;
      $('pickInput').value = kw || '';
      renderPick(kw || '');
      $('pickBk').classList.add('on');
      $('pickInput').focus();
    }
    function renderPick(kw) {
      const rows = allMembers.filter((x) => x.id !== editingId &&
        (!kw || (x.name || '').toLowerCase().includes(kw.toLowerCase())));
      $('pickList').innerHTML = rows.length
        ? rows.map((x) => `<div class="pickrow" data-id="${x.id}">${esc(x.name)}${x.role ? ` <span style="font-size:12px; color:var(--muted);">${esc(x.role)}</span>` : ''}</div>`).join('')
        : '<div class="empty">검색 결과가 없습니다.</div>';
      $('pickList').querySelectorAll('.pickrow').forEach((r) => {
        r.addEventListener('click', () => choosePick(r.dataset.id));
      });
    }
    function choosePick(id) {
      const m = allMembers.find((x) => x.id === id);
      if (!m) return;
      if (pickTarget === 'head') { connectHead(m); }
      else if (pickTarget === 'spouse') { $('fSpouse').value = m.name; pickSpouseId = id; }
      $('pickBk').classList.remove('on');
    }
    // 세대주 연결 + 회원번호 배지
    function connectHead(m) {
      pickHeadId = m.id;
      $('fHead').value = m.name;
      setHeadBadge(m.memberNo);
    }
    function setHeadBadge(no) {
      const b = $('headNoBadge');
      if (no !== null && no !== undefined && no !== '') {
        b.textContent = '#' + no; b.style.display = 'flex';
      } else { b.textContent = ''; b.style.display = 'none'; }
    }
    // [검색] 클릭: 본인 이름 비교 → 명부 조회 → 연결/팝업/안내
    function handleHeadSearch() {
      const typed = $('fHead').value.trim();
      const selfName = $('fName').value.trim();
      if (!typed) { openPicker('head'); return; }
      if (selfName && typed === selfName) {
        pickHeadId = null; setHeadBadge(null);
        $('fRel').value = '본인'; $('fHead').value = '';
        return;
      }
      const matches = allMembers.filter((x) => x.name === typed && x.id !== editingId);
      if (matches.length === 0) { setHeadBadge(null); pickHeadId = null; alert('명부에 없는 이름입니다.'); return; }
      if (matches.length === 1) { connectHead(matches[0]); return; }
      openPicker('head', typed);
    }
    $('headBtn').addEventListener('click', handleHeadSearch);
    $('fHead').addEventListener('input', () => { pickHeadId = null; setHeadBadge(null); });
    $('spouseBtn').addEventListener('click', () => openPicker('spouse'));
    $('fSpouse').addEventListener('input', () => { pickSpouseId = null; });
    $('pickInput').addEventListener('input', (e) => renderPick(e.target.value));
    $('pickClose').addEventListener('click', () => $('pickBk').classList.remove('on'));
    $('pickBk').addEventListener('click', (e) => { if (e.target === $('pickBk')) $('pickBk').classList.remove('on'); });

    async function resolveHousehold(selfId) {
      const relation = $('fRel').value;
      if (pickHeadId) {
        const head = allMembers.find((x) => x.id === pickHeadId);
        let hh = head?.householdId;
        if (!hh && head) {
          hh = head.id;
          await updateDoc(doc(db, 'members', head.id), {
            householdId: hh, headId: hh, headName: head.name,
            relation: head.relation || '본인'
          });
        }
        return { householdId: hh || selfId, headId: pickHeadId, headName: $('fHead').value, relation: relation || '' };
      }
      return { householdId: selfId, headId: selfId, headName: '', relation: relation || '본인' };
    }

    // ── 연락처·이메일 유틸 ──
    function fmtPhone(v) {
      const d = (v || '').replace(/\D/g, '').slice(0, 11);
      if (!d) return '';
      if (d.startsWith('02')) {
        if (d.length < 3) return d;
        if (d.length < 6) return d.slice(0, 2) + '-' + d.slice(2);
        if (d.length < 10) return d.slice(0, 2) + '-' + d.slice(2, 5) + '-' + d.slice(5);
        return d.slice(0, 2) + '-' + d.slice(2, 6) + '-' + d.slice(6, 10);
      }
      if (d.length < 4) return d;
      if (d.length < 7) return d.slice(0, 3) + '-' + d.slice(3);
      if (d.length < 11) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
      return d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7, 11);
    }
    function phoneOk(v) { const d = (v || '').replace(/\D/g, ''); return d.length >= 9 && d.length <= 11; }
    function emailOk(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

    const EMAIL_DOMAINS = ['naver.com', 'gmail.com', 'daum.net', 'hanmail.net', 'nate.com'];
    function onEmailDomainChange() {
      if ($('fEmailDomain').value === '__custom') {
        $('fEmailDomain').style.display = 'none';
        $('fEmailCustom').style.display = '';
        $('fEmailCustom').value = '';
        $('fEmailCustom').focus();
      }
    }
    // 직접입력 칸을 비우면 드롭다운으로 복귀
    function revertEmailDomainIfEmpty() {
      if (!$('fEmailCustom').value.trim()) {
        $('fEmailCustom').style.display = 'none';
        $('fEmailCustom').classList.remove('invalid');
        $('fEmailDomain').value = 'naver.com';
        $('fEmailDomain').style.display = '';
      }
    }
    // 저장된 email 문자열 → 아이디/도메인 칸으로 분리 로딩
    function setEmailFields(email) {
      $('fEmailId').classList.remove('invalid'); $('fEmailCustom').classList.remove('invalid');
      $('eEmailErr').classList.remove('show');
      const at = (email || '').lastIndexOf('@');
      if (at < 0) {
        $('fEmailId').value = email || ''; $('fEmailDomain').value = 'naver.com';
        $('fEmailDomain').style.display = ''; $('fEmailCustom').style.display = 'none'; $('fEmailCustom').value = ''; return;
      }
      $('fEmailId').value = email.slice(0, at);
      const dom = email.slice(at + 1);
      if (EMAIL_DOMAINS.includes(dom)) {
        $('fEmailDomain').value = dom; $('fEmailDomain').style.display = '';
        $('fEmailCustom').style.display = 'none'; $('fEmailCustom').value = '';
      } else {
        $('fEmailDomain').value = '__custom'; $('fEmailDomain').style.display = 'none';
        $('fEmailCustom').style.display = ''; $('fEmailCustom').value = dom;
      }
    }
    // 현재 입력 칸 → email 문자열 (아이디·도메인 모두 비면 '')
    function getEmailValue() {
      const id = $('fEmailId').value.trim();
      const dom = ($('fEmailDomain').value === '__custom' ? $('fEmailCustom').value.trim() : $('fEmailDomain').value);
      if (!id && ($('fEmailDomain').value === '__custom' && !dom)) return '';
      if (!id && !dom) return '';
      if (!id) return '';
      return id + '@' + dom;
    }

    async function saveMember() {
      const name = $('fName').value.trim();
      if (!name) {
        $('editMsg').textContent = '이름을 입력해 주세요.'; $('editMsg').style.display = 'block';
        $('acc1').classList.add('open');
        return;
      }
      // 연락처·이메일 검증 (비어 있으면 통과, 값이 있으면 형식 확인)
      $('fPhone').classList.remove('invalid'); $('ePhoneErr').classList.remove('show');
      $('fPhoneHome').classList.remove('invalid'); $('ePhoneHomeErr').classList.remove('show');
      $('fEmailId').classList.remove('invalid'); $('fEmailCustom').classList.remove('invalid'); $('eEmailErr').classList.remove('show');
      const phoneVal = $('fPhone').value.trim();
      if (phoneVal && !phoneOk(phoneVal)) {
        $('fPhone').classList.add('invalid'); $('ePhoneErr').classList.add('show');
        $('acc1').classList.add('open'); $('fPhone').focus();
        return;
      }
      const phoneHomeVal = $('fPhoneHome').value.trim();
      if (phoneHomeVal && !phoneOk(phoneHomeVal)) {
        $('fPhoneHome').classList.add('invalid'); $('ePhoneHomeErr').classList.add('show');
        $('acc1').classList.add('open'); $('fPhoneHome').focus();
        return;
      }
      const emailVal = getEmailValue();
      if (emailVal && !emailOk(emailVal)) {
        $('fEmailId').classList.add('invalid');
        if ($('fEmailDomain').value === '__custom') $('fEmailCustom').classList.add('invalid');
        $('eEmailErr').classList.add('show');
        $('acc1').classList.add('open');
        ($('fEmailDomain').value === '__custom' && !$('fEmailCustom').value.trim() ? $('fEmailCustom') : $('fEmailId')).focus();
        return;
      }
      const base = {
        name,
        gender: $('fGender').value,
        birth: $('fBirth').value.trim(),
        birthCal: $('fBirthCal').value,
        phone: phoneVal,
        phoneHome: phoneHomeVal,
        zipcode: $('fZip').value.trim(),
        address: $('fAddress').value.trim(),
        addressDetail: $('fAddressDetail').value.trim(),
        email: emailVal,
        regDate: $('fRegDate').value,
        regType: $('fRegType').value,
        guide: $('fGuide').value.trim(),
        prevChurch: $('fPrev').value.trim(),
        grade: $('fGrade').value,
        gradeDate: $('fGradeDate').value,
        gradeChurch: $('fGradeChurch').value.trim(),
        officiant: $('fOfficiant').value.trim(),
        role: $('fRole').value,
        memberType: $('fType').value,
        status: $('fStatus').value,
        marriage: $('fMarriage').value,
        wedDate: $('fWed').value,
        spouseId: pickSpouseId || null,
        spouseName: $('fSpouse').value.trim(),
        memo: $('fMemo').value.trim(),
        prayers: prayers.map((p) => ({ date: p.date || '', text: p.text || '' })),
        updatedAt: serverTimestamp(),
      };
      const btn = $('eSave');
      btn.disabled = true; btn.textContent = '저장 중…';
      try {
        if (editingId) {
          const hh = await resolveHousehold(editingId);
          await updateDoc(doc(db, 'members', editingId), { ...base, ...hh });
        } else {
          base.createdAt = serverTimestamp();
          base.createdBy = me.uid;
          base.memberNo = nextMemberNo();
          const ref = await addDoc(collection(db, 'members'),
            { ...base, householdId: null, headId: null, headName: '', relation: $('fRel').value || '' });
          editingId = ref.id;
          const hh = await resolveHousehold(ref.id);
          await updateDoc(ref, hh);
        }
        await loadMembers();
        openDetail(editingId);
      } catch (e) {
        $('editMsg').textContent = '저장 실패: ' + (e.code || e.message);
        $('editMsg').style.display = 'block';
      } finally {
        btn.disabled = false; btn.textContent = '저장';
      }
    }

    async function removeMember(id) {
      const m = allMembers.find((x) => x.id === id);
      if (!confirm(`'${m?.name || '이 성도'}' 님을 명부에서 삭제할까요?`)) return;
      try {
        await deleteDoc(doc(db, 'members', id));
        await loadMembers();
        closeViaBack();
      } catch (e) {
        alert('삭제 실패: ' + (e.code || e.message));
      }
    }

    // 연락처 실시간 하이픈 + 이메일 도메인 선택 전환
    // 카카오 우편번호 검색
    function openPostcode() {
      if (typeof daum === 'undefined' || !daum.Postcode) {
        alert('우편번호 서비스를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
        return;
      }
      new daum.Postcode({
        oncomplete: function (data) {
          $('fZip').value = data.zonecode;
          $('fAddress').value = data.roadAddress || data.jibunAddress;
          $('fAddressDetail').value = '';
          $('fAddressDetail').focus();
        }
      }).open();
    }

    $('fPhone').addEventListener('input', (e) => { e.target.value = fmtPhone(e.target.value); });
    $('fPhoneHome').addEventListener('input', (e) => { e.target.value = fmtPhone(e.target.value); });
    $('fZipBtn').addEventListener('click', openPostcode);
    $('fEmailDomain').addEventListener('change', onEmailDomainChange);
    $('fEmailCustom').addEventListener('blur', revertEmailDomainIfEmpty);

    // 접이식 토글
    document.querySelectorAll('.acc-head').forEach((h) => {
      h.addEventListener('click', () => {
        const acc = $(h.dataset.acc);
        acc.classList.toggle('open');
        const s = h.querySelector('.h-s');
        s.firstChild.textContent = acc.classList.contains('open') ? '접기 ' : '펼치기 ';
      });
    });

    // ── 화면 전환 (list=기본, detail/edit=오버레이) ──
    function applyView(view) {
      $('listView').style.display = (view === 'list') ? '' : 'none';
      $('detailView').style.display = (view === 'detail') ? '' : 'none';
      $('editView').style.display = (view === 'edit') ? '' : 'none';
      $('fab').style.display = (view === 'list') ? 'flex' : 'none';
      $('editBtn').style.display = (view === 'detail') ? 'block' : 'none';
      $('barTitle').textContent =
        (view === 'list') ? '성도 관리' :
        (view === 'detail') ? '성도 정보' :
        (editingId ? '성도 편집' : '성도 추가');
      window.scrollTo(0, 0);
    }
    function pushOverlay() { if (!overlayPushed) { history.pushState({ o: 1 }, ''); overlayPushed = true; } }
    function closeViaBack() { if (overlayPushed) { overlayPushed = false; history.back(); } }
    function leaveToList() { editingId = null; detailId = null; applyView('list'); }
    function show(view) {
      if (view === 'list') { leaveToList(); return; }
      pushOverlay(); applyView(view);
    }
    window.addEventListener('popstate', () => {
      if ($('pickBk').classList.contains('on')) { $('pickBk').classList.remove('on'); history.pushState({ o: 1 }, ''); return; }
      if (!overlayPushed) return;
      overlayPushed = false;
      leaveToList();
    });

    // ── 버튼 핸들러 ──
    $('fab').addEventListener('click', () => openEdit(null));
    $('editBtn').addEventListener('click', () => { if (detailId) openEdit(detailId); });
    $('eSave').addEventListener('click', saveMember);
    $('eCancel').addEventListener('click', () => {
      if (editingId && detailId === editingId) { applyView('detail'); }
      else { leaveToList(); closeViaBack(); }
    });
    $('backBtn').addEventListener('click', () => {
      if (overlayPushed) { leaveToList(); closeViaBack(); }
      else { location.href = 'index.html'; }
    });
  </script>
</body>
</html>
