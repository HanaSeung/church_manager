<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.json">
<title>보고서 · 재정 관리</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  :root{--green:#2f6f4f; --green-soft:#e7f1ec; --green-deep:#245540;
    --bg:#f5f6f4; --card:#fff; --text:#1f2421; --muted:#6b726d; --hint:#9aa19c;
    --line:#e2e5e1; --danger:#c0392b; --warn:#8a5a00; --warn-soft:#fdf3e0;}
  html{scrollbar-gutter:stable;}
  body{font-family:'Malgun Gothic', system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.6;}
  .wrap{max-width:720px; margin:0 auto; min-height:100vh; padding-bottom:40px;}
  /* PC 새 창: 가로 제한을 푼다. 12개월·주별 가로표를 스크롤 없이 한눈에 본다. */
  @media (min-width:900px){ .wrap{max-width:none;} }
  /* 회기 선택·기간·엑셀 버튼은 표를 내려보는 내내 필요하다. 헤더와 함께 통째로 고정한다.
     경계선은 이 블록 '바닥'에 하나만 긋는다. .bar 에 그으면 둘째 줄이 있을 때
     행 사이에 선이 생겨 두 줄이 남남처럼 갈린다. */
  .top{position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);}
  header{background:var(--green); color:#fff;
    display:grid; grid-template-columns:36px 1fr 36px; align-items:center; padding:14px 12px;}
  .circle{width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px; line-height:1;}
  header .title{text-align:center; font-size:17px; font-weight:600;}
  .bar{display:flex; align-items:center; gap:8px; padding:12px 14px; flex-wrap:wrap;}
  /* display 를 지정한 요소는 브라우저 기본 [hidden]{display:none} 을 이겨 버린다.
     .codebox 가 display:flex 라 예결산표 창에도 '–' 박스가 떠 있었다. */
  [hidden]{display:none !important;}
  .fysel{height:38px; padding:0 10px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:var(--card); color:var(--text);}
  .rangetxt{font-size:12px; color:var(--muted);}
  /* 동기화 상태 바 — 지금 보는 숫자가 언제 것인지 + 탈출구 */
  .syncbar{display:flex; align-items:center; gap:10px; padding:0 14px 10px;}
  .syncbar .sat{font-size:11.5px; color:var(--hint);}
  .syncbar .resync{height:26px; padding:0 10px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); border-radius:6px; font-size:11.5px;
    cursor:pointer; font-family:inherit;}
  .syncbar .resync:hover{border-color:var(--green); color:var(--green);}
  .syncbar .resync:disabled{color:var(--hint); cursor:default;}
  .xbtn{height:36px; padding:0 14px; border:1px solid var(--green);
    background:var(--card); color:var(--green); border-radius:8px; font-size:13px;
    font-weight:600; cursor:pointer; font-family:inherit;}
  .xbtn:disabled{border-color:var(--line); color:var(--hint); cursor:default;}
  .push{margin-left:auto;}
  /* 구분 라디오 (수입/지출). 선택지가 둘뿐이라 select 보다 클릭 한 번이 빠르다. */
  .kindbox{display:flex; align-items:center; gap:10px; height:38px; padding:0 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--card);}
  .kindbox .klab{font-size:12px; color:var(--muted);}
  .kindbox label{display:flex; align-items:center; gap:4px; font-size:14px; cursor:pointer;}
  .kindbox input{accent-color:var(--green); cursor:pointer;}
  .kindbox .ksep{width:1px; height:18px; background:var(--line); flex:none;}
  /* 지출에는 특별헌금이 없다. 고를 수 없다는 걸 눈으로 보여준다. */
  .kindbox label.off{color:var(--hint); cursor:default;}
  .kindbox label.off input{cursor:default;}
  /* 조회 기간 — 회기 select 옆에 인라인으로 붙는다 */
  .perbox{display:flex; align-items:center; gap:6px; flex-wrap:nowrap;}
  .plabel{font-size:12px; color:var(--muted); white-space:nowrap;}
  .perbox input{width:132px; height:36px; border:1px solid var(--line); border-radius:8px;
    padding:0 8px; font-size:13px; font-family:inherit; background:var(--card); color:var(--text);}
  .sbtn{height:36px; padding:0 12px; border:1px solid var(--green); background:var(--green); color:#fff;
    border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; flex:none;}
  .pbtn{height:36px; padding:0 10px; border:1px solid var(--green); background:#fff; color:var(--green);
    border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; flex:none;}
  /* 둘째 줄 — 구분 · 항목. 선도 배경도 주지 않는다. 첫 줄과 한 덩어리로 읽혀야 한다.
     둘째 줄이 있을 때만 .bar 의 아래 padding 을 줄여(tight) 간격이 두 배로 벌어지지 않게 한다.
     :has() 는 구형 폰 브라우저에서 안 먹을 수 있어 JS 로 클래스를 붙인다. */
  .row2{display:flex; align-items:center; gap:8px; padding:8px 14px 12px; flex-wrap:wrap;}
  .bar.tight{padding-bottom:4px;}
  /* 기간 선택 모달 */
  .ppgrid{display:grid; gap:6px; margin-bottom:8px;}
  .ppgrid.g2{grid-template-columns:repeat(2, minmax(0,1fr));}
  .ppgrid.g4{grid-template-columns:repeat(4, minmax(0,1fr));}
  .ppbtn{height:34px; border:1px solid var(--line); background:#fff; color:var(--text); border-radius:8px;
    font-size:13px; cursor:pointer; font-family:inherit;}
  .ppbtn.on{background:var(--green); border-color:var(--green); color:#fff; font-weight:600;}
  .ppbtn.mo{height:30px; font-size:11px;}
  .pphint{font-size:12px; color:var(--green); background:var(--green-soft); border-radius:8px;
    padding:6px 9px; margin-bottom:10px;}
  .pplab{font-size:11px; color:var(--muted); margin-bottom:5px;}
  #ppFySel{width:100%; height:38px; border:1px solid var(--line); border-radius:8px;
    padding:0 10px; font-size:14px; font-family:inherit; background:var(--card); color:var(--text);}
  #catSel{max-width:220px;}
</style>
<style>
  .warnbox{margin:0 14px 12px; padding:10px 12px; border-radius:9px; font-size:12.5px;
    background:var(--warn-soft); color:var(--warn); border:1px solid #f0dcb4; display:none;}
  .warnbox.on{display:block;}
  .warnbox b{font-weight:700;}
  .sect{margin:0 0 18px;}
  .sh{display:flex; align-items:baseline; gap:8px; padding:4px 14px 7px; font-size:14px; font-weight:700; color:var(--green-deep);}
  .sh .sub{font-size:11.5px; font-weight:400; color:var(--muted);}
  table.t{width:100%; max-width:880px; border-collapse:collapse; background:var(--card); table-layout:fixed;}
  table.t th{background:var(--green-soft); color:var(--green-deep); font-size:11.5px; font-weight:600;
    padding:7px 6px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); text-align:center;}
  /* 헤더는 '값과 같은 쪽'으로 붙인다.
     가운데 두면 소항목처럼 넓은 열에서 헤더가 값과 100px 넘게 벌어져 어긋나 보인다. */
  table.t th.hl{text-align:left; padding-left:10px;}
  table.t th.hn{text-align:left;}
  table.t th.hr{text-align:right; padding-right:10px;}
  table.t td{font-size:12.5px; padding:7px 6px; border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .c-g{width:78px;} .c-n{width:auto;} .c-m{width:96px;} .c-d{width:160px;}
  td.g{color:var(--muted); font-size:11.5px; text-align:left; padding-left:10px;}
  td.n{text-align:left;} td.m{text-align:right; padding-right:10px;}
  tr.sub td{background:#f7f9f8; font-weight:700;}
  tr.tot td{background:var(--green-soft); font-weight:700; color:var(--green-deep); border-bottom:2px solid var(--green);}
  td.neg{color:var(--danger);}
  td.pos{color:#1a5fb4;}
  td.m .dn{display:inline-block; min-width:84px; text-align:right;}
  td.m .rt{display:inline-block; width:48px; text-align:left; margin-left:6px;
    color:var(--muted); font-size:11px; font-weight:400;}
  .lead{padding:10px 14px 0; font-size:12.5px; color:var(--muted);}
  .loading{text-align:center; color:var(--muted); font-size:14px; padding:56px 16px;}
  /* 결산월을 못 읽었을 때: 틀린 숫자를 보여주느니 아무것도 안 보여준다 */
  .blocked{margin:24px 14px; padding:18px; border-radius:12px; background:#fdecea;
    border:1px solid #f3c2bd; color:#8a2c22;}
  .blocked .bt{font-size:15px; font-weight:700; margin-bottom:8px;}
  .blocked p{font-size:13px; line-height:1.7; margin-bottom:8px;}
  .blocked .bbtn{display:flex; gap:8px; margin-top:14px;}
  .blocked button{height:38px; padding:0 14px; border-radius:8px; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit; border:1px solid var(--danger);
    background:var(--card); color:var(--danger);}
  /* 가로표(월별·주별·성도별): 왼쪽 열을 고정한다 */
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch; border-top:1px solid var(--line);}
  table.m{border-collapse:separate; border-spacing:0; background:var(--card); min-width:100%;}
  table.m th{background:var(--green-soft); color:var(--green-deep); font-size:11px; font-weight:600;
    padding:6px 8px; border-bottom:1px solid var(--line); text-align:center; white-space:nowrap;}
  table.m td{font-size:11.5px; padding:6px 8px; border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;}
  /* 항목·소항목은 가운데. 헤더(table.m th)도 기본이 가운데라 서로 맞는다. 금액만 우측. */
  table.m td.g, table.m td.n{text-align:center;}
  table.m td.g{color:var(--muted); font-size:11px;}
  table.m .fix1{position:sticky; left:0; z-index:2; width:66px; min-width:66px;}
  table.m .fix2{position:sticky; left:66px; z-index:2; width:88px; min-width:88px;
    box-shadow:1px 0 0 var(--line);}
  table.m thead .fix1, table.m thead .fix2{z-index:3;}
  table.m tbody .fix1, table.m tbody .fix2{background:var(--card);}
  table.m tr.sub td{background:#f7f9f8; font-weight:700;}
  table.m tr.tot td{background:var(--green-soft); font-weight:700; color:var(--green-deep);}
  table.m td.sumcol{border-left:1px solid var(--line); font-weight:700;}
  /* 정렬 가능한 헤더 */
  table.m th[data-sk]{cursor:pointer; user-select:none;}
  table.m th[data-sk]:hover{background:#d9e9e1;}
  table.m th .ar{font-size:9px; margin-left:2px;}
  /* 총계와 특별헌금 사이의 빈 줄 (엑셀과 같은 간격) */
  table.m tr.spc td{height:12px; padding:0; border:none;}
  /* 성도별: 고정열이 No.·ID·이름·합계 네 개다.
     left 는 앞선 고정열 폭의 '누적값'이다: 0 → 32 → 78 → 140.
     그림자(경계선)는 마지막 고정열에만 준다. 다 주면 세로줄이 네 줄 그어진다. */
  table.m .fix3, table.m .fix4{position:sticky; z-index:2;}
  table.m thead .fix3, table.m thead .fix4{z-index:3;}
  table.m tbody .fix3, table.m tbody .fix4{background:var(--card);}
  table.m.mem th, table.m.mem td{padding:6px 4px;}   /* 고정열 4개라 좌우 여백을 8→4 로 줄인다 */
  table.m.mem .fix1{left:0;    width:32px; min-width:32px; box-shadow:none;}
  table.m.mem .fix2{left:32px; width:46px; min-width:46px; box-shadow:none;}
  table.m.mem .fix3{left:78px; width:62px; min-width:62px; box-shadow:none;}
  table.m.mem .fix4{left:140px; width:92px; min-width:92px; box-shadow:1px 0 0 var(--line); padding-right:8px;}
  /* 성도별: 금액이 아닌 열(No.·ID·이름)은 가운데. 금액 열은 자릿수를 맞춰야 하므로 우측. */
  table.m.mem td.seq{color:var(--hint); font-size:11px; text-align:center;}
  table.m.mem td.g{color:var(--muted); font-size:11px; font-family:monospace; text-align:center;}
  table.m.mem td.n{color:var(--text); font-size:12px; font-weight:600; text-align:center;}
  table.m.mem td.tsum{font-weight:700;}
  /* 검색 결과 강조. 초록 계열은 소계·합계 행이 이미 쓰고 있어 노란 계열로 간다.
     .mem .hit 는 클래스 3개라 tbody .fix1(2개)을 이겨 고정열까지 함께 물든다. */
  table.m.mem tr.hit td{background:#fff5cc;}
  table.m.mem tr.hit td.n{color:var(--text);}
  /* ID 는 '보여주는 칸'이다. 입력받지 않는다 (offering.html 의 codebox 와 같은 성격). */
  .codebox{display:flex; align-items:center; justify-content:center; height:38px;
    min-width:64px; padding:0 10px; border:1px solid var(--line); border-radius:8px;
    background:var(--bg); color:var(--muted); font-family:monospace; font-size:13px;
    user-select:none; flex:none;}
  #qName{width:120px;}
  /* 명세 목록 (offering.html 의 .itbl 을 그대로 가져왔다 — 두 화면이 달라 보이면 안 된다) */
  .itblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .itbl{border-collapse:collapse; font-size:12px; white-space:nowrap; min-width:100%; background:var(--card);}
  .itbl th{color:var(--hint); font-weight:400; text-align:center; padding:7px 8px; border-bottom:1px solid var(--line);}
  .itbl td{padding:8px; border-bottom:1px solid var(--line); color:var(--text); text-align:center;}
  .itbl .ra{text-align:right;} .itbl .ce{text-align:center;}
  .itbl .amt{color:var(--green); font-weight:600;}
  .itbl th.sortable{cursor:pointer;} .itbl th.sortable:hover{color:var(--green);}
  .itbl .sar{color:var(--green); font-size:10px; margin-left:2px;}
  .itbl .iact{border:none; background:none; padding:3px; cursor:pointer; line-height:0; vertical-align:middle;}
  .itbl .iact svg{width:18px; height:18px;}
  .itbl .i-edit{color:var(--muted);} .itbl .i-del{color:var(--danger); margin-left:4px;}
  .itbl .i-note{color:var(--green);}
  .imemo{margin:8px 14px 0; font-size:12px; color:var(--muted); padding:8px 12px; background:var(--green-soft);
    border-left:3px solid var(--green); border-radius:8px; display:none; white-space:normal; word-break:break-word;}
  .imemo b{color:var(--text); font-weight:600;}

  /* ---- 일괄 수정 패널 ---- */
  .bulk{margin:0 14px 14px; border:1px solid var(--green); border-radius:10px; overflow:hidden;
    background:var(--card); max-width:520px;}
  .bulk .bh{display:flex; align-items:center; gap:8px; padding:9px 12px;
    background:var(--green-soft); color:var(--green-deep); font-size:13px; font-weight:600;}
  .bulk .bh .cnt{background:var(--green); color:#fff; border-radius:20px; padding:1px 9px; font-size:11px;}
  .bulk .bh .bx{margin-left:auto; cursor:pointer; color:var(--green-deep); font-size:16px; line-height:1;
    background:none; border:none; font-family:inherit;}
  .bulk .fld{display:flex; align-items:center; gap:10px; padding:8px 12px; border-top:1px solid var(--line);}
  .bulk .fld .lab{width:64px; flex:none; font-size:12px; color:var(--muted);}
  .bulk .fld input, .bulk .fld select{flex:1; min-width:0; height:36px; border:1px solid var(--line);
    border-radius:8px; padding:0 9px; font-size:13px; font-family:inherit;
    background:var(--card); color:var(--text);}
  /* 고른 건들의 값이 서로 다른 칸: 비워 두고 '-' 를 흐리게. 손대지 않으면 그대로 남는다. */
  .bulk .fld.mixed input, .bulk .fld.mixed select{color:var(--hint); background:var(--bg);}
  .bulk .fld.mixed .lab{color:var(--hint);}
  /* 항목 드롭다운 — offering.html 수입·지출 탭과 같은 방식.
     펼치면 계단식(부모 = 선택 불가 제목 줄), 닫히면 '이름만'.
     진짜 select(.selreal)를 투명하게 덮어씌우고, 보이는 것은 .selface 다. */
  .bulk .selwrap{position:relative; flex:1; min-width:0;}
  .bulk .selface{height:36px; line-height:36px; border:1px solid var(--line); border-radius:8px;
    background-color:var(--card); padding:0 30px 0 9px; font-size:13px; color:var(--text);
    overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center;}
  /* .bulk .fld select 규칙(높이·테두리)을 이겨야 하므로 선택자를 한 단계 더 준다. */
  .bulk .fld select.selreal{position:absolute; inset:0; width:100%; height:100%;
    opacity:0; margin:0; padding:0; border:none; background:none;}
  .bulk .fld.mixed .selface{color:var(--hint); background-color:var(--bg);}
  .bulk .bf{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line);}
  .bulk .bsave{flex:1; height:42px; border:none; border-radius:8px; background:var(--green); color:#fff;
    font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;}
  .bulk .bsave:disabled{background:var(--hint); cursor:default;}
  .bulk .bcancel{height:42px; padding:0 16px; border:1px solid var(--line); border-radius:8px;
    background:var(--card); color:var(--muted); font-size:14px; cursor:pointer; font-family:inherit;}
  .bulk .bmsg{padding:0 12px 10px; font-size:12px; color:var(--danger);}
  .itbl tr.sel td{background:#fff5cc;}
  .itbl .ck{cursor:pointer; accent-color:var(--green); margin:0; vertical-align:middle;}

  /* ---- 표 헤더 고정 (성도별 · 기간검색) ----
     .scrollx / .itblwrap 은 가로 스크롤 컨테이너다. 그 안의 thead 를 sticky 로 걸면
     '뷰포트'가 아니라 '컨테이너 상단'에 붙는다 → 페이지를 내리면 컨테이너째 올라가 헤더도 사라진다.
     그래서 컨테이너에 높이 제한을 줘서 세로 스크롤을 컨테이너 안으로 가져온다.
     --topH 는 sticky 상단 블록의 실제 높이. 창마다 줄 수가 달라 JS 에서 재서 넣는다. */
  body.stickhead .scrollx, body.stickhead .itblwrap{
    overflow:auto; max-height:calc(100vh - var(--topH, 140px) - 56px);}
  body.stickhead table.m thead th{position:sticky; top:0; z-index:3;}
  body.stickhead table.m thead .fix1,
  body.stickhead table.m thead .fix2,
  body.stickhead table.m thead .fix3,
  body.stickhead table.m thead .fix4{z-index:5;}   /* 모서리 칸: 가로·세로 양쪽으로 고정 */
  body.stickhead .itbl thead th{position:sticky; top:0; z-index:2;
    background:var(--card); box-shadow:0 1px 0 var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <div class="top" id="top">
    <header>
      <span class="circle" id="backBtn" aria-label="뒤로">‹</span>
      <span class="title" id="ttl">보고서</span>
      <span></span>
    </header>

    <div class="bar" id="bar">
      <select id="fySel" class="fysel" aria-label="회계연도"></select>
      <select id="moSel" class="fysel" aria-label="월" hidden></select>
      <span id="periodBox" class="perbox" hidden>
        <span class="plabel">조회 기간</span>
        <input type="date" id="fromD">
        <span style="color:var(--hint);">~</span>
        <input type="date" id="toD">
        <button class="sbtn" id="goBtn">검색</button>
        <button class="pbtn" id="periodPickBtn">기간선택</button>
      </span>
      <span id="kindBox" class="kindbox" hidden>
        <span class="klab">구분</span>
        <label><input type="radio" name="kind" value="income" checked>수입</label>
        <label><input type="radio" name="kind" value="expense">지출</label>
        <span class="ksep" id="ksep"></span>
        <label id="spLab"><input type="checkbox" id="spChk">특별헌금</label>
        <label id="etcLab"><input type="checkbox" id="etcChk">기타</label>
      </span>
      <select id="catSel" class="fysel" aria-label="항목" hidden></select>
      <div id="qNo" class="codebox" hidden>–</div>
      <input id="qName" class="fysel" placeholder="이름" hidden>
      <button id="qBtn" class="xbtn" hidden>검색</button>
      <span class="rangetxt" id="rangeTxt">–</span>
      <button class="xbtn push" id="xlsBtn" hidden disabled>엑셀 내보내기</button>
    </div>

    <!-- 기간 단위 검색 전용 둘째 줄. buildControls 에서 구분·항목을 여기로 옮겨 담는다. -->
    <div class="row2" id="row2" hidden></div>

    <!-- 동기화 상태. 지금 보는 숫자가 '언제 것인지' 사용자가 알아야 한다.
         [전체 다시 읽기] = 로컬을 버리고 Firestore 에서 전량 재적재하는 탈출구. -->
    <div class="syncbar" id="syncBar"></div>
  </div>

  <div class="warnbox" id="warnBox"></div>
  <div id="body"><div class="loading">불러오는 중…</div></div>

  <!-- 기간 선택 모달 (offering.html 과 동일 규칙) -->
  <div id="periodModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45);
    z-index:1000; align-items:center; justify-content:center; padding:16px;">
    <div style="background:var(--card); border-radius:14px; padding:20px; width:100%; max-width:340px; max-height:88vh; overflow-y:auto;">
      <div style="font-size:16px; font-weight:600; margin-bottom:14px;">기간 선택</div>
      <div class="pplab">회기</div>
      <select id="ppFySel" style="margin-bottom:6px;"></select>
      <div class="pphint" id="ppFyRange">–</div>
      <div class="pplab">범위</div>
      <div class="ppgrid g2">
        <button type="button" class="ppbtn" data-pp="all">회기 전체</button>
        <button type="button" class="ppbtn" data-pp="h1">상반기</button>
      </div>
      <div class="ppgrid g2">
        <button type="button" class="ppbtn" data-pp="h2">하반기</button>
        <button type="button" class="ppbtn" data-pp="none" style="visibility:hidden;"></button>
      </div>
      <div class="ppgrid g4">
        <button type="button" class="ppbtn" data-pp="q1">1분기</button>
        <button type="button" class="ppbtn" data-pp="q2">2분기</button>
        <button type="button" class="ppbtn" data-pp="q3">3분기</button>
        <button type="button" class="ppbtn" data-pp="q4">4분기</button>
      </div>
      <div class="pplab" style="margin-top:10px;">월 <span class="sub">(달력 기준)</span></div>
      <div class="ppgrid g4" id="ppMonths"></div>
      <div style="display:flex; gap:8px; margin-top:12px;">
        <button id="ppCancel" style="flex:1; height:44px; border:1px solid var(--line); background:#fff;
          color:var(--text); border-radius:8px; font-size:15px; cursor:pointer;">취소</button>
        <button id="ppApply" style="flex:1; height:44px; border:none; background:var(--green); color:#fff;
          border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;">적용</button>
      </div>
    </div>
  </div>
</div>
<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  import {
    collection, query, where, getDocs, doc, getDoc, deleteDoc, updateDoc, serverTimestamp, writeBatch
  } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
  // 변경 로그: 재정 데이터의 모든 변경을 기록한다. 본체와 '같은 배치'로 커밋해야 한다.
  import { addLog } from "./changelog.js";
  // 로컬 사본: 리포트는 Firestore 를 읽지 않는다. 로컬에서 읽는다 → 읽기 0.
  // resetAll(전체 다시 읽기)은 offering.html 설치 탭으로 옮겼다. 여기선 읽기·시각표시만.
  import { sync, localNodes, localRange, lastSyncAt } from "./finstore.js";

  const $ = (id) => document.getElementById(id);
  const MIN_LEVEL = 3;
  const COL = 'finConfig';

  const FUNDS = ['일반', '선교', '장학', '건축', '차량'];
  const DEFAULT_FUND = '일반';
  const CARRY_C1 = '이월';          // 이월 대분류 이름 (offering.html 의 isCarryOver 와 같은 규칙)

  // ---- 보고서 종류 ----
  // 파일을 5개로 쪼개면 조회·매칭 로직이 5벌 복사된다. 한 파일에서 ?type= 로 갈아끼운다.
  const TYPES = {
    bs:      { title: '예결산표',         ctrl: ['xls'] },
    monthly: { title: '년간 월별 집계표', ctrl: ['kind'] },
    weekly:  { title: '월간 주별 집계표', ctrl: ['mo', 'kind'] },
    range:   { title: '기간 단위 검색',   ctrl: ['kind', 'cat', 'period', 'xls'] },
    member:  { title: '성도별 헌금 집계', ctrl: ['q'] }
  };
  const P = new URLSearchParams(location.search);
  const TYPE = TYPES[P.get('type')] ? P.get('type') : 'bs';
  const CTRL = TYPES[TYPE].ctrl;
  document.title = TYPES[TYPE].title + ' · 재정 관리';
  $('ttl').textContent = TYPES[TYPE].title;

  // 결산월. 실제로는 finConfig/settings 에서 읽어 덮어쓴다.
  // 못 읽으면 이 값을 쓰는 게 아니라 화면을 '차단'한다(blockNoSettings). 최후의 안전망일 뿐이다.
  let closeMonth = 11;
  let curFY = Number(P.get('fy')) || null;
  let curMo = 0;                    // weekly: 회기 내 월 순번 0~11
  let curKind = 'income';           // monthly/weekly/range: 구분 라디오 (수입 | 지출)
  let showSp = false;               // monthly/weekly: 특별헌금 블록을 낼지. 기본은 꺼짐(수입만).
  let showEtc = false;              // monthly/weekly: '기타' 대분류 블록을 낼지. 기본 꺼짐 → 일반재정+소계만.
  let curCat = '';                  // range: 선택한 항목의 이름경로 ('' = 전체)
  let ppFy = null, ppSel = null;    // 기간선택 모달 상태
  let nodes = [];                   // finConfig 전체 노드
  let members = [];                 // 성도 명부(56명). 일괄수정에서 이름→번호 매칭에 쓴다.
  let incDocs = [], expDocs = [];   // 조회된 문서
  let agg = null;                   // 집계 결과
  let memQ = '';                    // 성도별: '적용된' 이름 검색어 (입력칸 값과 별개다)
  // 성도별 정렬. 기본은 ID 오름차순 = 명부 순서 (members.html 의 'no' 정렬과 같은 관례).
  // key: 'no' | 'name' | 'total' | 'i:<열번호>'
  let memSort = { key: 'no', dir: 1 };
  let me = null;                    // 로그인 사용자 (updatedBy 기록용)
  let selIds = new Set();           // 기간검색: 일괄 수정으로 고른 문서 id
  let bulkOpen = false;             // 일괄 수정 패널이 열려 있나
  let bulkInit = null;              // 패널을 열 때의 '시작값'. 저장 시 지금 값과 비교해 달라진 칸만 덮는다.
  // 이름 일괄수정: 명부 매칭으로 '확정된' 성도. null=미확정/안 바꿈. {no, name} 확정 시에만 저장한다.
  //   자유 텍스트를 그대로 믿지 않는다 — 반드시 명부에서 찾아 번호까지 맞춘 것만 patch 한다.
  let bulkName = null;

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
  // 금액 입력칸에서 콤마·공백을 걷어낸다 (offering.html 과 같은 규칙).
  // ※ 임포트용 impAmt 와 다르다. 여기 입력값에는 소수점이 없다.
  const onlyNum = (s) => Number(String(s == null ? '' : s).replace(/[^0-9]/g, '') || 0);
  const pad = (n) => String(n).padStart(2, '0');
  const codeNum = (c) => Number(String(c).replace(/[^0-9]/g, '')) || 0;
  // 경로 비교 키: 공백 차이를 흡수한다 ('일반재정 › 주일헌금' === '일반재정›주일헌금')
  const catKey = (s) => String(s || '').replace(/\s+/g, '');
  const toYMD = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  // 성도 ID 표시 형식. members.html 516행 · offering.html 과 같은 규칙으로 맞춘다 (#001).
  const padNo = (n) => {
    const v = Number(n);
    return (Number.isFinite(v) && v > 0) ? '#' + String(v).padStart(3, '0') : '';
  };
  const parseYMD = (s) => { const [y, m, d] = (s || '').split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };

  // ---- 회기 범위 (offering.html 과 동일 규칙) ----
  // 회기 N = (결산월 다음달, N-1년) ~ (결산월, N년)
  const lastDay = (y, m) => new Date(y, m, 0).getDate();
  function fyStart(fy) {
    const m = closeMonth === 12 ? 1 : closeMonth + 1;
    const y = closeMonth === 12 ? fy : fy - 1;
    return { y, m };
  }
  function fyMonth(fy, i) {
    const s = fyStart(fy);
    const t = s.m - 1 + i;
    return { y: s.y + Math.floor(t / 12), m: (t % 12) + 1 };
  }
  function fyRange(fy) {
    const a = fyMonth(fy, 0), b = fyMonth(fy, 11);
    return { from: `${a.y}-${pad(a.m)}-01`, to: `${b.y}-${pad(b.m)}-${pad(lastDay(b.y, b.m))}` };
  }
  // 회기 내 i0~i1 번째 달만 잘라낸 기간 (기간선택 모달의 반기·분기·월 버튼용)
  function fyRangeIdx(fy, i0, i1) {
    const a = fyMonth(fy, i0), b = fyMonth(fy, i1);
    return { from: `${a.y}-${pad(a.m)}-01`, to: `${b.y}-${pad(b.m)}-${pad(lastDay(b.y, b.m))}` };
  }
  // 'YYYY-MM-DD' → 회기 내 월 순번 0~11 (범위 밖이면 -1)
  function monthIdx(fy, ymd) {
    const s = fyStart(fy);
    const y = Number(String(ymd).slice(0, 4)), m = Number(String(ymd).slice(5, 7));
    if (!y || !m) return -1;
    const i = (y - s.y) * 12 + (m - s.m);
    return (i >= 0 && i < 12) ? i : -1;
  }
  const monthLabels = (fy) => Array.from({ length: 12 }, (_, i) => pad(fyMonth(fy, i).m) + '월');
  const fiscalYearOf = (d) => (d.getMonth() + 1) <= closeMonth ? d.getFullYear() : d.getFullYear() + 1;

  // ---- 주차 (offering.html 의 weekLabel 과 완전히 같은 규칙) ----
  // 그 날짜가 속한 주의 '일요일'을 찾아, 그 일요일의 날짜로 주차를 매긴다.
  // 일요일 1~7일=1주, 8~14=2주 … 29~31=5주. 그래서 4/2(수)는 '3월 5주'가 된다.
  function weekOf(ymd) {
    const d = parseYMD(ymd);
    const sun = new Date(d); sun.setDate(d.getDate() - d.getDay());
    return { y: sun.getFullYear(), m: sun.getMonth() + 1, no: Math.floor((sun.getDate() - 1) / 7) + 1 };
  }
  // 문서의 week 필드에 저장되는 문자열. offering.html 의 weekLabel 과 글자까지 같아야 한다.
  // 일괄 수정으로 날짜를 바꾸면 week 도 함께 다시 찍는다. 안 그러면 날짜와 주차가 어긋난다.
  const weekLabel = (ymd) => { const w = weekOf(ymd); return `${w.m}월 ${w.no}주`; };
  // 그 달에 실제로 존재하는 주차 번호 (일요일이 몇 번 오는지에 따라 4개 또는 5개)
  function weekNos(y, m) {
    const out = [];
    for (let d = 1, ld = lastDay(y, m); d <= ld; d++) {
      if (new Date(y, m - 1, d).getDay() === 0) out.push(Math.floor((d - 1) / 7) + 1);
    }
    return out;
  }

  // ---- 가로표의 칸(bucket) 정의 ----
  // 년간 = 12개월, 월간 = 그 달의 주차. 집계 로직은 하나만 쓰고 이 객체만 갈아끼운다.
  // strict:true 면 칸에 안 들어가는 문서는 합계에서도 뺀다 (주별표는 조회 범위를 ±7일 넓게 잡으므로 필수).
  let BK = null;
  function setBucket() {
    if (TYPE === 'weekly') {
      const { y, m } = fyMonth(curFY, curMo);
      const nos = weekNos(y, m);
      BK = {
        n: nos.length, strict: true,
        labels: nos.map((k) => `${k}주`),
        of: (ymd) => { const w = weekOf(ymd); return (w.y === y && w.m === m) ? nos.indexOf(w.no) : -1; }
      };
    } else {
      BK = { n: 12, strict: false, labels: monthLabels(curFY), of: (ymd) => monthIdx(curFY, ymd) };
    }
  }

  // ---- 트리 도우미 ----
  const scope = (kind) => nodes.filter((c) => Number(c.fy) === curFY && c.kind === kind);
  const childrenOf = (kind, pid) => scope(kind)
    .filter((c) => (c.parentId || null) === (pid || null))
    .sort((a, b) => codeNum(a.code) - codeNum(b.code));
  const isLeaf = (kind, id) => !scope(kind).some((c) => c.parentId === id);

  function fundOf(node, byId) {
    let n = node, guard = 0;
    while (n && guard++ < 10) {
      if (n.fund && FUNDS.includes(n.fund)) return n.fund;
      if (!n.parentId) break;
      n = byId[n.parentId];
    }
    return DEFAULT_FUND;
  }
  function pathOf(node, byId) {
    const parts = []; let n = node, guard = 0;
    while (n && guard++ < 10) { parts.unshift(String(n.name || '').trim()); n = n.parentId ? byId[n.parentId] : null; }
    return parts.join(' › ');
  }
  function rootOf(node, byId) {
    let n = node, guard = 0;
    while (n && n.parentId && guard++ < 10) n = byId[n.parentId];
    return n;
  }

  // ---- 뒤로 ----
  // PC 는 새 창으로 열렸다(opener 가 있다) → 창을 닫는다. 폰은 같은 탭이므로 메뉴로 되돌린다.
  $('backBtn').onclick = () => {
    if (window.opener && !window.opener.closed) { window.close(); return; }
    location.href = 'stats.html';
  };

  onAuthStateChanged(auth, async (user) => {
    if (!user) { location.replace('index.html'); return; }
    me = user;
    try {
      const snap = await getDoc(doc(db, 'users', user.uid));
      const lv = snap.exists() ? (snap.data().level || 1) : 1;
      if (lv < MIN_LEVEL) { alert('통계는 재정 담당자만 이용할 수 있습니다.'); location.replace('index.html'); return; }

      // 결산월을 못 읽으면 회기 기간이 통째로 어긋난다.
      // 통계는 숫자가 곧 결과물이라, 조용히 기본값으로 계산하지 않고 '멈춘다'.
      if (!(await loadCloseMonth())) { blockNoSettings(); return; }

      // ★ 로컬 사본을 최신으로 맞춘다. 여기서만 Firestore 를 읽는다.
      //   변경이 없으면 읽기 0. 있으면 바뀐 것만. 첫 설치·30일 초과·대량변경이면 전량.
      $('body').innerHTML = '<div class="loading">자료를 맞추는 중…</div>';
      await sync();

      await loadNodes();
      await loadMembers();
      buildControls();
      await reload();
      showSyncAt();
    } catch (e) {
      console.error(e);
      $('body').innerHTML = '<div class="loading">불러오지 못했습니다.</div>';
    }
  });

  // 성공하면 true. settings 문서가 없거나 closeMonth 가 비정상이면 false.
  async function loadCloseMonth() {
    try {
      const s = await getDoc(doc(db, 'finConfig', 'settings'));
      if (!s.exists()) return false;
      const m = Number(s.data().closeMonth);
      if (!Number.isInteger(m) || m < 1 || m > 12) return false;
      closeMonth = m;
      return true;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  function blockNoSettings() {
    $('fySel').disabled = true;
    $('xlsBtn').disabled = true;
    $('rangeTxt').textContent = '';
    $('warnBox').classList.remove('on');
    $('body').innerHTML = `<div class="blocked">
      <div class="bt">결산 월 설정을 불러오지 못했습니다.</div>
      <p>결산 월을 모르면 회계연도 기간을 계산할 수 없습니다.
         틀린 숫자를 보여드리지 않기 위해 통계를 표시하지 않습니다.</p>
      <p>인터넷 연결을 확인하고 새로고침하거나, <b>설치 › 결산 월 설정</b>에서 결산 월을 먼저 지정하세요.</p>
      <div class="bbtn">
        <button id="retryBtn">다시 시도</button>
        <button id="goSetBtn">결산 월 설정으로</button>
      </div>
    </div>`;
    $('retryBtn').onclick = () => location.reload();
    $('goSetBtn').onclick = () => { location.href = 'offering.html?tab=set'; };
  }

  // 항목 노드를 '로컬'에서 읽는다. Firestore 를 건드리지 않는다.
  // (회기 목록도 여기서 뽑는다 — 그래서 회기 필터를 걸 수 없었다. 로컬이면 전량이어도 공짜다.)
  async function loadNodes() {
    const all = await localNodes();
    nodes = all.filter((c) => c.kind === 'income' || c.kind === 'expense');
    const ys = [...new Set(nodes.map((c) => Number(c.fy)).filter(Boolean))];
    if (curFY == null || !ys.length) curFY = ys.length ? Math.max(...ys) : fiscalYearOf(new Date());
  }

  // 성도 명부(56명)를 읽는다. 일괄수정에서 '이름 → 번호' 매칭에만 쓴다.
  //   56건이라 읽기 부담이 없어 로컬화하지 않고 그냥 읽는다(offering.html 과 같은 방식).
  //   권한이 없으면(rules) 조용히 빈 배열로 둔다 — 일괄수정 이름칸에서 안내한다.
  async function loadMembers() {
    try {
      const qs = await getDocs(collection(db, 'members'));
      members = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
    } catch (e) {
      console.warn('명부를 읽지 못했습니다(이름 일괄수정 비활성):', e.code || e.message);
      members = [];
    }
  }

  // 일괄 수정 선택 해제. 구분·항목·기간이 바뀌면 이전 선택은 의미가 없다.
  // (수입 문서를 골라 놓고 지출로 넘어가면, 그 id 로 expenses 를 고치려 든다)
  const clearSel = () => { selIds.clear(); bulkOpen = false; bulkInit = null; bulkName = null; };

  // ---- 상단 컨트롤 (보고서 종류마다 다르다) ----
  function buildControls() {
    const ys = new Set(nodes.map((c) => Number(c.fy)).filter(Boolean));
    ys.add(curFY);
    $('fySel').innerHTML = [...ys].sort((a, b) => b - a)
      .map((y) => `<option value="${y}"${y === curFY ? ' selected' : ''}>${y}년도</option>`).join('');
    $('fySel').onchange = async () => { curFY = Number($('fySel').value); syncControls(); await reload(); };

    if (CTRL.includes('mo')) { $('moSel').hidden = false; $('moSel').onchange = async () => { curMo = Number($('moSel').value); await reload(); }; }
    if (CTRL.includes('kind')) {
      $('kindBox').hidden = false;
      // 기간검색에는 특별헌금 체크박스를 두지 않는다. 거기는 항목 select 로 직접 고른다.
      const useSp = (TYPE === 'monthly' || TYPE === 'weekly');
      $('spLab').hidden = $('ksep').hidden = !useSp;
      $('etcLab').hidden = !useSp;
      if (useSp) $('spChk').onchange = () => { showSp = $('spChk').checked; if (agg) renderAll(); };
      if (useSp) $('etcChk').onchange = () => { showEtc = $('etcChk').checked; if (agg) renderAll(); };
      document.querySelectorAll('input[name="kind"]').forEach((el) => {
        el.onchange = () => {
          curKind = el.value;
          // 수입·지출 문서는 이미 둘 다 읽어 뒀다. 재조회하지 않고 그리기만 다시 한다.
          if (useSp) { syncSpChk(); syncEtcChk(); }
          // 항목 목록은 구분마다 다른 트리라 다시 채운다 (선택은 '전체'로 초기화).
          if (CTRL.includes('cat')) { curCat = ''; fillCats(); }
          clearSel();
          if (agg) renderAll();
        };
      });
      if (useSp) { syncSpChk(); syncEtcChk(); }
    }
    if (CTRL.includes('cat')) {
      $('catSel').hidden = false;
      $('catSel').onchange = () => { curCat = $('catSel').value; clearSel(); if (agg) renderAll(); };
    }
    if (CTRL.includes('period')) {
      $('periodBox').hidden = false;
      $('goBtn').onclick = () => reload();
      $('periodPickBtn').onclick = openPeriodPick;
      $('ppCancel').onclick = closePeriodPick;
      $('ppApply').onclick = applyPeriodPick;
      $('ppFySel').onchange = () => ppSetFy(Number($('ppFySel').value));
      $('periodModal').onclick = (e) => { if (e.target === $('periodModal')) closePeriodPick(); };
      // 구분·항목은 둘째 줄로 내린다. 첫 줄은 회기 + 조회기간만 남긴다.
      // appendChild 는 '이동'이다. 노드를 다시 만들지 않으므로 위에서 붙인 핸들러가 그대로 살아 있다.
      $('row2').appendChild($('kindBox'));
      $('row2').appendChild($('catSel'));
      $('row2').hidden = false;
      $('bar').classList.add('tight');   // 첫 줄 아래 여백을 줄여 두 줄 간격을 맞춘다
    }
    if (CTRL.includes('q')) {
      $('qNo').hidden = $('qName').hidden = $('qBtn').hidden = false;
      $('qName').enterKeyHint = 'search';
      // 검색은 '적용된 값'(memQ)으로만 거른다. 입력칸을 직접 읽으면
      // 타자 도중의 미완성 이름으로 표가 계속 다시 그려진다(52명 × 항목 수).
      $('qBtn').onclick = doSearch;
      $('qName').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
    }
    if (CTRL.includes('xls')) {
      $('xlsBtn').hidden = false;
      // 기간검색: 버튼을 둘째 줄 '전체 항목'(catSel) 옆에 붙인다.
      //   row2 에는 이미 구분·항목이 담겨 있어 그 뒤로 이어 붙는다. push(오른쪽 밀기)는 뗀다.
      //   예결산표(period 없음)는 그대로 바 오른쪽 정렬(push)로 남긴다.
      if (CTRL.includes('period')) {
        $('xlsBtn').classList.remove('push');
        $('row2').appendChild($('xlsBtn'));
      }
    }
    syncControls();
  }

  // 검색어를 '적용'하고 다시 그린다. 재조회는 하지 않는다(이미 읽어 둔 문서로 거른다).
  function doSearch() {
    memQ = String($('qName').value || '').trim();
    if (agg) renderAll();
  }

  // ---- 성도별 정렬 ----
  // 헤더는 매번 새로 그려지므로 개별 바인딩 대신 #body 에 한 번만 위임한다.
  $('body').addEventListener('click', (e) => {
    const th = e.target.closest('th[data-sk]');
    if (!th || !agg) return;
    const k = th.dataset.sk;
    if (memSort.key === k) memSort.dir = -memSort.dir;
    // 새 열을 누를 때: 이름·ID 는 오름차순, 금액은 '많은 순'이 먼저 보고 싶은 게 상식이다.
    else memSort = { key: k, dir: (k === 'no' || k === 'name') ? 1 : -1 };
    renderAll();
  });

  function memCmp(a, b) {
    const { key: k, dir: d } = memSort;
    if (k === 'name') return d * a.name.localeCompare(b.name, 'ko');
    if (k === 'no') {
      const na = Number(a.no) || 0, nb = Number(b.no) || 0;
      // 명부 미연동(번호 없음)은 방향과 무관하게 항상 맨 뒤. seqCmp 에 d 를 곱하면 여기가 뒤집힌다.
      if (!na !== !nb) return na ? -1 : 1;
      if (na !== nb) return d * (na - nb);
      return a.name.localeCompare(b.name, 'ko');
    }
    const va = (k === 'total') ? a.total : a.cells[Number(k.slice(2))];
    const vb = (k === 'total') ? b.total : b.cells[Number(k.slice(2))];
    if (va !== vb) return d * (va - vb);
    return seqCmp(a, b);   // 동점은 명부 순 (순서가 흔들리지 않게)
  }

  // 명부 순서 = ID 오름차순. 번호 없는 사람(명부 미연동)은 항상 맨 뒤.
  // No. 를 매기는 기준이자, 정렬 동점일 때의 최종 기준이다.
  function seqCmp(a, b) {
    const na = Number(a.no) || 0, nb = Number(b.no) || 0;
    if (!na !== !nb) return na ? -1 : 1;
    if (na !== nb) return na - nb;
    return a.name.localeCompare(b.name, 'ko');
  }
  const arrow = (k) => (memSort.key === k ? `<span class="ar">${memSort.dir === 1 ? '▲' : '▼'}</span>` : '');

  // 지출에는 특별헌금이 없다 (목적기금은 수입 쪽 개념).
  // 숨기지 않고 '비활성'으로 남긴다 — 사라졌다 나타나면 바 폭이 출렁인다.
  function syncSpChk() {
    const on = (curKind === 'income');
    $('spChk').disabled = !on;
    $('spLab').classList.toggle('off', !on);
    $('spLab').title = on ? '' : '지출에는 특별헌금이 없습니다';
  }

  // 기타 체크도 특별헌금과 같게 — 지출에선 비활성(잠금). 숨기지 않아 바 폭이 안 출렁인다.
  function syncEtcChk() {
    const on = (curKind === 'income');
    $('etcChk').disabled = !on;
    $('etcLab').classList.toggle('off', !on);
    $('etcLab').title = on ? '' : '지출에는 기타 구분이 없습니다';
  }

  // 회기가 바뀌면 월 목록과 기간 기본값도 그 회기에 맞춰 다시 채운다.
  function syncControls() {
    if (CTRL.includes('mo')) {
      $('moSel').innerHTML = monthLabels(curFY)
        .map((l, i) => `<option value="${i}"${i === curMo ? ' selected' : ''}>${l}</option>`).join('');
    }
    if (CTRL.includes('period')) {
      const r = fyRange(curFY);
      $('fromD').value = r.from; $('toD').value = r.to;
    }
    if (CTRL.includes('cat')) { curCat = ''; fillCats(); }
  }

  // ---- 항목 선택 ----
  // 트리 순서대로 들여쓴다. 값은 '이름 경로'다 (문서가 이름 경로로 저장되므로 그대로 대조된다).
  // 상위를 고르면 그 아래 전부가 걸린다.
  function fillCats() {
    const byId = {}; nodes.forEach((n) => { byId[n.id] = n; });
    const out = ['<option value="">전체 항목</option>'];
    const walk = (pid, depth) => {
      childrenOf(curKind, pid).forEach((c) => {
        const p = pathOf(c, byId);
        out.push(`<option value="${esc(p)}">${'　'.repeat(depth)}${esc(c.name)}</option>`);
        walk(c.id, depth + 1);
      });
    };
    walk(null, 0);
    $('catSel').innerHTML = out.join('');
    $('catSel').value = curCat;
  }
  // ---- 기간 선택 모달 (offering.html 과 같은 규칙) ----
  function ppRangeOf(kind, mi) {
    switch (kind) {
      case 'all': return { i0: 0, i1: 11 };
      case 'h1': return { i0: 0, i1: 5 };
      case 'h2': return { i0: 6, i1: 11 };
      case 'q1': return { i0: 0, i1: 2 };
      case 'q2': return { i0: 3, i1: 5 };
      case 'q3': return { i0: 6, i1: 8 };
      case 'q4': return { i0: 9, i1: 11 };
      case 'mon': return { i0: mi, i1: mi };
    }
    return null;
  }
  function ppRenderMonths() {
    $('ppMonths').innerHTML = Array.from({ length: 12 }, (_, i) => {
      const d = fyMonth(ppFy, i);
      return `<button type="button" class="ppbtn mo" data-pp="mon" data-mi="${i}">${String(d.y).slice(2)}.${pad(d.m)}</button>`;
    }).join('');
    ppBind();
  }
  function ppBind() {
    document.querySelectorAll('#periodModal .ppbtn[data-pp]').forEach((b) => {
      const kind = b.getAttribute('data-pp');
      if (kind === 'none') return;
      b.onclick = () => {
        ppSel = ppRangeOf(kind, Number(b.getAttribute('data-mi')));
        document.querySelectorAll('#periodModal .ppbtn').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        ppShowRange();
      };
    });
  }
  function ppShowRange() {
    const s = ppSel || { i0: 0, i1: 11 };
    const r = fyRangeIdx(ppFy, s.i0, s.i1);
    $('ppFyRange').textContent = `${r.from} ~ ${r.to}`;
  }
  function ppSetFy(fy) {
    ppFy = fy; ppSel = null;
    ppRenderMonths();
    document.querySelectorAll('#periodModal .ppbtn').forEach((b) => b.classList.remove('on'));
    ppShowRange();
  }
  function openPeriodPick() {
    const ys = [...new Set(nodes.map((c) => Number(c.fy)).filter(Boolean))].sort((a, b) => b - a);
    if (!ys.length) ys.push(curFY);
    const cur = ys.includes(curFY) ? curFY : ys[0];
    $('ppFySel').innerHTML = ys.map((y) => `<option value="${y}"${y === cur ? ' selected' : ''}>${y} 회기</option>`).join('');
    ppSetFy(cur);
    $('periodModal').style.display = 'flex';
  }
  function closePeriodPick() { $('periodModal').style.display = 'none'; }
  async function applyPeriodPick() {
    if (!ppSel) { alert('범위를 선택하세요.'); return; }
    const r = fyRangeIdx(ppFy, ppSel.i0, ppSel.i1);
    $('fromD').value = r.from;
    $('toD').value = r.to;
    closePeriodPick();
    // 모달에서 회기를 바꿨으면 상단 회기도 따라간다.
    // 안 그러면 예산·항목 트리는 옛 회기 것인데 날짜만 새 회기라 숫자가 뒤섞인다.
    if (ppFy !== curFY) {
      curFY = ppFy;
      $('fySel').value = String(curFY);
      if (CTRL.includes('cat')) { curCat = ''; fillCats(); }
    }
    await reload();
  }

  // ---- 조회 범위 ----
  // weekly 는 ±7일 넓게 잡는다. 주차는 '일요일' 기준이라 4/2(수)가 '3월 5주'로 가는 등
  // 달 경계를 넘나든다. 넓게 읽고 BK.of() 로 정확히 거른다(BK.strict).
  function qRange() {
    if (TYPE === 'range') {
      const f = $('fromD').value, t = $('toD').value;
      if (f && t && f <= t) return { from: f, to: t };
      return fyRange(curFY);
    }
    if (TYPE === 'weekly') {
      const { y, m } = fyMonth(curFY, curMo);
      const a = new Date(y, m - 1, 1); a.setDate(a.getDate() - 7);
      const b = new Date(y, m - 1, lastDay(y, m)); b.setDate(b.getDate() + 7);
      return { from: toYMD(a), to: toYMD(b) };
    }
    return fyRange(curFY);
  }

  async function reload() {
    setBucket();
    // 조회 대상이 바뀌면 이전 선택은 무효다. 안 지우면 화면에 없는 문서를 일괄 수정하게 된다.
    clearSel();
    const r = qRange();
    // range 는 기간을 .period 섹션에 크게 띄우므로 바에는 건수만 나중에 채운다.
    const shown = (TYPE === 'weekly')
      ? (() => { const { y, m } = fyMonth(curFY, curMo); return `${y}-${pad(m)} (${BK.n}개 주)`; })()
      : (TYPE === 'range') ? '' : `${r.from} ~ ${r.to}`;
    $('rangeTxt').textContent = shown;
    $('xlsBtn').disabled = true;
    $('body').innerHTML = '<div class="loading">불러오는 중…</div>';
    try {
      // ★ 로컬에서 읽는다. Firestore 를 건드리지 않는다 → 읽기 0.
      //   회기·월·기간을 아무리 바꿔도, 통계를 몇 번을 열어도 비용이 없다.
      //   (문서에는 fy 가 없다. 예전과 똑같이 날짜 범위로 거른다.)
      const [a, b] = await Promise.all([
        localRange('offerings', r.from, r.to),
        localRange('expenses', r.from, r.to)
      ]);
      incDocs = a;
      expDocs = b;
      agg = aggregate();
      renderAll();
      $('xlsBtn').disabled = false;
    } catch (e) {
      console.error(e);
      $('body').innerHTML = '<div class="loading">조회에 실패했습니다.</div>';
    }
  }

  // ---- 집계 ----
  // 문서는 항목 노드를 참조하지 않고 이름·코드를 '복사'해 저장한다(스냅샷).
  // 따라서 이름 경로(catPath)로 노드를 되찾는다. code 는 재채번으로 바뀔 수 있어 믿지 않는다.
  function leafMap(kind, byId) {
    const m = {};
    scope(kind).forEach((n) => { m[catKey(pathOf(n, byId))] = n; });
    return m;
  }
  const docPath = (d) => d.catPath || [d.c1, d.c2, d.c3].filter(Boolean).join(' › ');

  function aggregate() {
    const byId = {}; nodes.forEach((n) => { byId[n.id] = n; });

    const build = (kind, docs) => {
      const keyMap = leafMap(kind, byId);
      const actual = {};                       // nodeId → 결산 합계
      const buckets = {};                      // nodeId → [칸별 금액]
      let unmatchedCnt = 0, unmatchedAmt = 0;  // 항목을 못 찾은 기록
      let nonLeafCnt = 0, nonLeafAmt = 0;      // 하위항목이 생겨 표에 자리가 없는 기록
      docs.forEach((d) => {
        const amt = Number(d.amount || 0);
        const bi = BK.of(d.date);
        if (BK.strict && bi < 0) return;       // 조회 범위는 넓지만 이 칸에 속하지 않는다
        const n = keyMap[catKey(docPath(d))];
        if (!n) { unmatchedCnt++; unmatchedAmt += amt; return; }
        if (!isLeaf(kind, n.id)) { nonLeafCnt++; nonLeafAmt += amt; return; }
        actual[n.id] = (actual[n.id] || 0) + amt;
        if (bi >= 0) {
          if (!buckets[n.id]) buckets[n.id] = new Array(BK.n).fill(0);
          buckets[n.id][bi] += amt;
        }
      });

      // 트리 순서대로 리프를 뽑는다 (엑셀 행 순서와 같다)
      const leaves = [];
      const walk = (pid) => {
        childrenOf(kind, pid).forEach((c) => {
          if (isLeaf(kind, c.id)) leaves.push(c); else walk(c.id);
        });
      };
      walk(null);

      const rows = leaves.map((n) => {
        const root = rootOf(n, byId);
        return {
          id: n.id, code: n.code || '',
          c1: root ? String(root.name || '') : '',
          name: String(n.name || ''),
          path: pathOf(n, byId),
          fund: fundOf(n, byId),
          carry: root && String(root.name || '').trim() === CARRY_C1,
          budget: Number(n.budget || 0),
          actual: Number(actual[n.id] || 0),
          months: buckets[n.id] || new Array(BK.n).fill(0)
        };
      });
      return { rows, unmatchedCnt, unmatchedAmt, nonLeafCnt, nonLeafAmt };
    };

    const inc = build('income', incDocs);
    const exp = build('expense', expDocs);

    // 수입 3분류:
    //   이월    = 대분류가 '이월'          (수입부총계에 넣지 않는다)
    //   경상    = 기금 '일반' & 이월 아님   → 수입부총계
    //   목적기금 = 기금 '일반' 아님 & 이월 아님 → 특별헌금 블록
    const carry   = inc.rows.filter((r) => r.carry);
    const normal  = inc.rows.filter((r) => !r.carry && r.fund === DEFAULT_FUND);
    const special = inc.rows.filter((r) => !r.carry && r.fund !== DEFAULT_FUND);

    return { inc, exp, carry, normal, special, expRows: exp.rows };
  }

  // c1 단위로 묶는다 (엑셀의 세로병합 + 소계 구조)
  function groupByC1(rows) {
    const out = [], idx = {};
    rows.forEach((r) => {
      if (!(r.c1 in idx)) { idx[r.c1] = out.length; out.push({ c1: r.c1, rows: [] }); }
      out[idx[r.c1]].rows.push(r);
    });
    out.forEach((g) => {
      g.budget = g.rows.reduce((s, r) => s + r.budget, 0);
      g.actual = g.rows.reduce((s, r) => s + r.actual, 0);
    });
    return out;
  }
  const sumB = (rows) => rows.reduce((s, r) => s + r.budget, 0);
  const sumA = (rows) => rows.reduce((s, r) => s + r.actual, 0);

  // ---- 렌더 ----
  function renderAll() {
    renderWarn();
    const html = [];
    if (TYPE === 'bs') {
      html.push(tableHtml('수입부', '기금 · 일반재정', groupByC1(agg.normal), '수입부 총계'));
      if (agg.special.length) html.push(tableHtml('특별헌금', '목적기금 · 수입부 총계에 포함되지 않는다', groupByC1(agg.special), '특별헌금 소계'));
      if (agg.carry.length) html.push(tableHtml('이월', '전 회기에서 넘어온 잔액 · 수입이 아니다', groupByC1(agg.carry), '이월 합계'));
      html.push(tableHtml('지출부', '', groupByC1(agg.expRows), '지출 총계'));
      html.push(balanceHtml());
      // 예결산표 창은 '원래 통계탭 한 화면'이다. 월별 내역까지 이어서 보여준다.
      html.push(gridHtml('수입내역 (월별)', agg.normal, agg.special));
      html.push(gridHtml('지출내역 (월별)', agg.expRows));
    } else if (TYPE === 'range') {
      html.push(rangeHtml());
    } else if (TYPE === 'monthly') {
      // 구분 라디오로 하나만 낸다. 12개월 × 항목 15개짜리 표를 둘 다 쌓으면
      // 지출을 보려고 수입표를 통째로 지나쳐야 한다.
      // 특별헌금 체크를 끄면 tail 을 빈 배열로 넘긴다 → 합계(헌금+기타)만 남는다.
      if (curKind === 'income') html.push(incGrid('수입내역 (월별)'));
      else html.push(gridHtml('지출내역 (월별)', agg.expRows));
    } else if (TYPE === 'weekly') {
      if (!BK.n) html.push('<div class="loading">해당 월에 주일이 없습니다.</div>');
      if (curKind === 'income') html.push(incGrid('수입내역 (주별)'));
      else html.push(gridHtml('지출내역 (주별)', agg.expRows));
    } else if (TYPE === 'member') {
      html.push(memberHtml());
    }
    $('body').innerHTML = html.join('');
    fitHead();
    // 찾은 사람이 50번째면 화면 밖이다. 강조만 해 놓고 안 데려오면 못 찾는다.
    // block:'center' — 표 안(스크롤 컨테이너)에서 가운데로 온다.
    const hit = $('firstHit');
    if (hit) hit.scrollIntoView({ block: 'center' });
  }

  // ---- 동기화 상태 표시 + 탈출구 ----
  // 사용자가 지금 보는 숫자가 '언제 것인지' 몰라선 안 된다 → 기준 시각만 표시한다.
  // [전체 다시 읽기]는 offering.html 의 설치 탭으로 옮겼다(탈출구를 한곳에 모은다).
  async function showSyncAt() {
    const d = await lastSyncAt();
    const el = $('syncBar');
    if (!el) return;
    const t = d
      ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`
      : '없음';
    el.innerHTML = `<span class="sat">${t} 기준 자료</span>`;
  }

  // ---- 표 헤더 고정: 상단 블록의 실제 높이를 재서 --topH 에 넣는다 ----
  // 창마다 컨트롤 줄 수가 다르고(기간검색은 2줄), 폭이 좁으면 flex-wrap 으로 더 늘어난다.
  // 하드코딩하면 헤더가 상단 바에 가리거나 틈이 생긴다.
  // 예결산표(bs)는 뺀다 — 한 화면에 표가 6개라 각 표에 높이 제한을 주면 화면이 조각난다.
  const STICK_HEAD = (TYPE === 'member' || TYPE === 'range' || TYPE === 'weekly' || TYPE === 'monthly');
  function fitHead() {
    if (!STICK_HEAD) return;
    document.body.classList.add('stickhead');
    document.documentElement.style.setProperty('--topH', $('top').offsetHeight + 'px');
  }
  window.addEventListener('resize', fitHead);

  // ---- 기간 단위 검색 ----
  // 개별 명세만 낸다 (offering.html 수입·지출 목록과 동일한 컬럼).
  // 집계표는 두지 않는다 — 명세 제목줄의 '건수 · 합계'와 표 안의 합계 행까지 세 번 겹친다.
  // 기간이 자유라 예산·기금별잔액도 의미가 없다. 예산 비교는 예결산표 창에서.
  function rangeHtml() {
    const title = curKind === 'income' ? '수입' : '지출';
    const catTxt = curCat ? esc(curCat) : '전체 항목';
    const recs = catFilterDocs(curKind === 'income' ? incDocs : expDocs);
    const sum = recs.reduce((s, r) => s + (Number(r.amount) || 0), 0);

    if (!recs.length) {
      return `<div class="sect">
        <div class="sh">${title} 명세<span class="sub">${catTxt} · 0건</span></div>
        <div class="loading">이 기간에 기록이 없습니다.</div></div>`;
    }
    return `<div class="sect">
      <div class="sh">${title} 명세<span class="sub">${catTxt} · ${recs.length}건, 합계: ${fmt(sum)}원 · 헤더를 눌러 정렬</span></div>
      <div id="bulkHost">${bulkHtml(recs)}</div>
      ${curKind === 'income' ? incTable(recs) : expTable(recs)}
      <div id="memoBar" class="imemo"></div>
    </div>`;
  }

  // ---- 일괄 수정 ----
  // 고른 건들의 값이 같으면 그 값을, 다르면 빈칸 + placeholder '-' (칸 전체를 흐리게).
  // 저장할 때 '연 시점의 값(bulkInit)'과 비교해 **달라진 칸만** 덮어쓴다.
  // 그래서 서로 다른 칸은 건드리지 않는 한 그대로 남고, 일부러 비우면 그건 '삭제'로 인정된다.
  const MIXED = '\u0000MIXED';      // 값이 제각각임을 나타내는 표식. 실제 데이터에 나올 수 없는 문자.
  function commonVal(docs, get) {
    if (!docs.length) return '';
    const first = get(docs[0]);
    return docs.every((d) => get(d) === first) ? first : MIXED;
  }
  // 저장은 리프(말단) 항목에만 한다. 상위에 저장하면 부모가 자식 합계를 또 더해 이중계상된다.
  // 표시는 offering.html 수입·지출 탭과 같다 — 부모는 선택 불가 제목 줄, 리프는 들여쓰기 + '·' + 이름만.
  const IND = '\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0';   // 한 단계 들여쓰기 (offering.html 과 동일)
  function leafOpts(sel) {
    const byId = {}; nodes.forEach((n) => { byId[n.id] = n; });
    const out = [];
    const walk = (pid, level) => {
      childrenOf(curKind, pid).forEach((c) => {
        const kids = childrenOf(curKind, c.id);
        const ind = IND.repeat(level - 1);
        if (kids.length) {                                   // 부모는 고를 수 없다 (제목 줄)
          out.push(`<option disabled style="color:var(--hint);">${ind}${esc(String(c.name || '').trim())}</option>`);
          walk(c.id, level + 1);
          return;
        }
        const p = pathOf(c, byId);
        out.push(`<option value="${esc(c.id)}"${catKey(p) === catKey(sel) ? ' selected' : ''}>${ind}·\u00A0${esc(String(c.name || '').trim())}</option>`);
      });
    };
    walk(null, 1);
    return out.join('');
  }
  // 이름 경로 → 리프 노드 id. 트리에 없으면 '' (항목이 지워졌거나 이름이 바뀐 기록).
  function leafIdOf(path) {
    if (!path) return '';
    const byId = {}; nodes.forEach((n) => { byId[n.id] = n; });
    const hit = scope(curKind).find((c) => isLeaf(curKind, c.id) && catKey(pathOf(c, byId)) === catKey(path));
    return hit ? hit.id : '';
  }
  // 닫힌 칸에는 '이름만' 찍는다 (들여쓰기·표식·경로 없이). 못 고르는 상태면 '-'.
  const leafName = (id) => {
    const it = nodes.find((n) => n.id === id);
    return it ? String(it.name || '').trim() : '';
  };
  function updateBCatFace() {
    const s = $('bCat'), f = $('bCatFace');
    if (!s || !f) return;
    f.textContent = leafName(s.value) || '-';
  }
  function bulkHtml(recs) {
    if (!bulkOpen) return '';
    const picked = recs.filter((r) => selIds.has(r.id));
    if (!picked.length) return '';

    const isInc = curKind === 'income';
    const vDate = commonVal(picked, (d) => d.date || '');
    const vPath = commonVal(picked, (d) => d.catPath || '');
    const vAmt = commonVal(picked, (d) => String(d.amount || ''));
    const vMemo = commonVal(picked, (d) => d.memo || '');
    const vPayee = isInc ? '' : commonVal(picked, (d) => d.payee || '');
    // 성도 이름: 수입에만. 시작값은 화면 표시용(=현재 공통 이름 또는 MIXED)이다.
    //   실제 저장은 이름을 '다시 타이핑해 명부 매칭한' 경우에만 일어난다(bulkName 로 확정).
    const vName = isInc ? commonVal(picked, (d) => d.memberName || '') : '';

    // 패널을 여는 지금이 '시작값'이다. 저장 시 이것과 비교한다.
    bulkInit = { date: vDate, path: vPath, amount: vAmt, memo: vMemo, payee: vPayee, name: vName };

    // 항목: 값이 제각각(MIXED)이거나 트리에서 못 찾으면 '-' 를 골라 둔다.
    // 못 찾았는데 첫 항목이 자동 선택되면, 손대지 않아도 엉뚱한 항목으로 덮어써진다.
    const selId = (vPath === MIXED) ? '' : leafIdOf(vPath);

    const mx = (v) => (v === MIXED ? ' mixed' : '');
    const val = (v) => (v === MIXED ? '' : esc(v));
    const ph = (v) => (v === MIXED ? ' placeholder="-"' : '');

    const payeeRow = isInc ? '' : `
      <div class="fld${mx(vPayee)}"><span class="lab">수령인</span>
        <input id="bPayee" type="text" value="${val(vPayee)}"${ph(vPayee)}></div>`;

    // 이름 행(수입 전용). 비우면 '안 바꿈'. 타이핑하면 명부 매칭 후에만 확정된다.
    //   #번호 칸과 상태줄로 '지금 누구로 확정됐는지'를 보여준다 — 잘못된 성도로 덮어쓰는 사고를 막는다.
    const nameRow = !isInc ? '' : `
      <div class="fld${mx(vName)}"><span class="lab">이름</span>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; gap:6px; align-items:center;">
            <span id="bMemNo" style="flex:0 0 auto; min-width:34px; text-align:center; font-size:12px;
              color:var(--hint); border:1px solid var(--line); border-radius:6px; padding:2px 4px;">–</span>
            <input id="bName" type="text" value="${val(vName)}"${ph(vName)}
              placeholder="${vName === MIXED ? '제각각 — 바꾸려면 이름 입력' : '안 바꾸려면 그대로'}"
              style="flex:1; min-width:0;">
          </div>
          <div id="bNameMsg" style="font-size:12px; margin-top:3px;"></div>
        </div></div>`;

    return `<div class="bulk">
      <div class="bh"><span>일괄 수정</span><span class="cnt">${picked.length}건 선택</span>
        <button class="bx" id="bClose" aria-label="닫기">✕</button></div>
      <div class="fld${mx(vDate)}"><span class="lab">날짜</span>
        <input id="bDate" type="date" value="${val(vDate)}"></div>
      ${nameRow}
      <div class="fld${mx(vPath)}"><span class="lab">항목</span>
        <div class="selwrap">
          <div class="selface"><span id="bCatFace">${esc(leafName(selId) || '-')}</span></div>
          <select id="bCat" class="selreal">${selId ? '' : '<option value="" selected>-</option>'}${leafOpts(selId ? vPath : '')}</select>
        </div></div>
      <div class="fld${mx(vAmt)}"><span class="lab">금액</span>
        <input id="bAmt" type="text" inputmode="numeric" value="${vAmt === MIXED ? '' : fmt(vAmt)}"${ph(vAmt)}></div>
      ${payeeRow}
      <div class="fld${mx(vMemo)}"><span class="lab">${isInc ? '비고' : '적요'}</span>
        <input id="bMemo" type="text" value="${val(vMemo)}"${ph(vMemo)}></div>
      <div class="bmsg" id="bMsg" hidden></div>
      <div class="bf">
        <button class="bsave" id="bSave">${picked.length}건 일괄 수정 저장</button>
        <button class="bcancel" id="bCancel">취소</button>
      </div>
    </div>`;
  }

  // 날짜가 mixed 라 빈칸으로 열렸을 때, 사용자가 안 건드렸으면 빈칸 그대로다 → 안 바뀐 것.
  // 시작값도 MIXED(=화면상 빈칸)였으므로 '' !== MIXED 가 되어 오탐이 난다. 그래서 따로 판정한다.
  const changed = (now, init) => (init === MIXED ? now !== '' : now !== init);

  // 이름 입력칸(#bName)을 명부와 대조해 '한 성도'로 확정한다(bulkName).
  //   offering.html 의 doNameSearch 와 같은 규칙: 정확히 1명이면 연동, 동명이인이면 고르게,
  //   없으면 저장을 막는다(A안). 확정돼야만 bulkSave 가 번호+이름을 patch 한다.
  function bulkNameMatch() {
    const inp = $('bName'); if (!inp) return;
    const box = $('bNameMsg'); const noEl = $('bMemNo');
    const val = inp.value.trim();
    bulkName = null; if (noEl) noEl.textContent = '–';
    const set = (html) => { if (box) box.innerHTML = html; };

    // 비웠거나 시작값 그대로면 '안 바꿈' — 조용히 둔다.
    if (!val || val === bulkInit.name) { set(''); return; }
    if (!members.length) { set('<span style="color:var(--danger)">명부를 불러오지 못해 이름을 바꿀 수 없습니다.</span>'); return; }

    const exact = members.filter((m) => (m.name || '').trim() === val);
    if (exact.length === 1) { setBulkName(exact[0]); return; }
    if (exact.length > 1) {
      set('<span style="color:var(--muted)">동명이인입니다. 선택하세요:</span> '
        + '<span id="bNamePick"></span>');
      const pk = $('bNamePick');
      exact.forEach((m) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = `${m.name}${m.memberNo ? ' #' + m.memberNo : ''}`;
        b.style.cssText = 'margin:2px 4px 0 0; padding:2px 8px; border:1px solid var(--green);'
          + 'background:#fff; color:var(--green); border-radius:6px; font-size:12px; cursor:pointer; font-family:inherit;';
        b.onclick = () => setBulkName(m);
        pk.appendChild(b);
      });
      return;
    }
    // 명부에 없음 → A안: 막는다. (일괄수정에서 새 성도 등록은 하지 않는다.)
    set('<span style="color:var(--danger)">명부에 없는 이름입니다. 정확한 이름을 입력하세요.</span>');
  }
  function setBulkName(m) {
    bulkName = { no: Number(m.memberNo) || 0, name: m.name };
    const inp = $('bName'); if (inp) inp.value = m.name;
    const noEl = $('bMemNo'); if (noEl) noEl.textContent = bulkName.no || '0';
    const box = $('bNameMsg');
    if (box) box.innerHTML = `<span style="color:var(--green)">✓ ${esc(m.name)} 성도로 확정${bulkName.no ? ' · #' + bulkName.no : ''}</span>`;
  }

  async function bulkSave() {
    const recs = catFilterDocs(curKind === 'income' ? incDocs : expDocs);
    const picked = recs.filter((r) => selIds.has(r.id));
    if (!picked.length) return;

    const msg = (t) => { const b = $('bMsg'); b.textContent = t; b.hidden = !t; };
    msg('');

    const isInc = curKind === 'income';
    const nDate = $('bDate').value;
    const nPath = $('bCat').value ? pathOfId($('bCat').value) : '';
    const nAmt = String(onlyNum($('bAmt').value) || '');
    const nMemo = $('bMemo').value.trim();
    const nPayee = isInc ? '' : $('bPayee').value.trim();

    const patch = {};
    if (changed(nDate, bulkInit.date)) {
      if (!nDate) return msg('날짜를 비울 수는 없습니다.');
      patch.date = nDate;
      patch.week = weekLabel(nDate);       // 날짜만 바꾸고 주차를 안 바꾸면 둘이 어긋난다
    }
    if (changed(nPath, bulkInit.path)) {
      const it = nodes.find((n) => n.id === $('bCat').value);
      if (!it) return msg('항목을 다시 고르세요.');
      const byId = {}; nodes.forEach((n) => { byId[n.id] = n; });
      const parts = pathOf(it, byId).split(' › ');
      // 항목은 한 벌로 갱신해야 한다. code 만 바꾸고 c1/c2/c3 를 놔두면 집계가 어긋난다.
      patch.c1 = parts[0] || '';
      patch.c2 = parts[1] || '';
      patch.c3 = parts[2] || '';
      patch.catPath = parts.join(' › ');
      patch.code = it.code || '';
    }
    if (changed(nAmt, bulkInit.amount)) {
      const a = Number(nAmt);
      if (!a) return msg('금액을 비우거나 0 으로 할 수는 없습니다.');
      patch.amount = a;
    }
    if (changed(nMemo, bulkInit.memo)) patch.memo = nMemo;
    if (!isInc && changed(nPayee, bulkInit.payee)) patch.payee = nPayee;

    // 이름(수입 전용): 입력칸이 시작값과 달라졌으면 '바꾸려는 것'이다.
    //   단, 명부에서 확정(bulkName)되지 않았으면 저장하지 않는다 — 번호 없는 이름은 집계를 깨뜨린다.
    if (isInc) {
      const nName = $('bName') ? $('bName').value.trim() : '';
      if (changed(nName, bulkInit.name)) {
        if (!nName) return msg('이름을 비울 수는 없습니다. 바꾸지 않으려면 원래 이름 그대로 두세요.');
        if (!bulkName || bulkName.name !== nName) {
          return msg('이름을 명부에서 확정하세요. (이름을 입력한 뒤 Enter 또는 조회)');
        }
        patch.memberNo = bulkName.no;
        patch.memberName = bulkName.name;
      }
    }

    const keys = Object.keys(patch);
    if (!keys.length) return msg('바뀐 칸이 없습니다.');
    // week(날짜 부산물)·memberNo(이름 부산물)·항목 세부키는 확인 문구에서 숨긴다 — 실제로 고른 칸만 보인다.
    const hide = new Set(['week', 'memberNo', 'c1', 'c2', 'c3', 'catPath', 'code']);
    const label = { date: '날짜', memberName: '이름', amount: '금액', memo: '비고', payee: '수령인' };
    const disp = keys.filter((k) => !hide.has(k)).map((k) => label[k] || k);
    if (patch.catPath !== undefined) disp.push('항목');
    if (!confirm(`${picked.length}건의 [${disp.join(', ')}] 을(를) 바꿉니다. 진행할까요?`)) return;

    const btn = $('bSave'); btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const coll = isInc ? 'offerings' : 'expenses';
      // 56명 규모라 건수가 많지 않다. 순차 저장으로 충분하고, 실패 지점을 알기 쉽다.
      // 각 건마다 본체+로그를 한 배치로 묶는다 — 따로 쓰면 로그가 빠져 로컬이 영영 낡는다.
      for (const r of picked) {
        const b = writeBatch(db);
        b.update(doc(db, coll, r.id), { ...patch, updatedAt: serverTimestamp(), updatedBy: me.uid });
        addLog(b, { coll, docId: r.id, op: 'update', by: me.uid });
        await b.commit();
      }
      bulkOpen = false;
      selIds.clear();
      // 내가 바꾼 것을 로컬에도 반영해야 한다. 안 하면 화면이 옛 숫자를 보여준다.
      // (내가 남긴 로그를 내가 읽어 따라잡는다 — 몇 건이라 싸다.)
      await sync();
      await reload();
      await showSyncAt();
    } catch (e) {
      btn.disabled = false; btn.textContent = `${picked.length}건 일괄 수정 저장`;
      msg('저장 실패: ' + (e.code || e.message));
    }
  }
  const pathOfId = (id) => {
    const byId = {}; nodes.forEach((n) => { byId[n.id] = n; });
    return byId[id] ? pathOf(byId[id], byId) : '';
  };

  // 항목 필터를 '문서'에 적용한다 (집계행이 아니라 원본 기록).
  function catFilterDocs(docs) {
    if (!curCat) return docs;
    const k = catKey(curCat);
    return docs.filter((d) => {
      const dk = catKey(docPath(d));
      return dk === k || dk.startsWith(k + '›');
    });
  }

  // ---- 명세 목록 (offering.html 919·1094행과 같은 컬럼·같은 정렬 규칙) ----
  const SVG_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  const SVG_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
  const SVG_NOTE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>';

  let recSort = { key: 'date', dir: 'desc' };
  const wkNo = (r) => { const m = (r.week || '').match(/(\d+)\s*주/); return m ? m[1] : ''; };

  // 문서의 no 필드는 폐기됐다(저장 때마다 컬렉션 전체를 읽던 nextSeq 를 걷어냈다).
  // 동점 처리는 문서 id 로 갈음한다. 성도별 집계의 no 는 memberNo 라 무관하다.
  const idCmp = (a, b) => String(a.id || '').localeCompare(String(b.id || ''));

  function recSortVal(r, k) {
    switch (k) {
      // 'no' 는 없다. 그 열 자리에 체크박스가 들어간다.
      case 'fy': return fiscalYearOf(parseYMD(r.date));
      case 'week': return Number(wkNo(r)) || 0;
      case 'date': return r.date || '';
      case 'item': return r.code || '';
      case 'id': return Number(curKind === 'income' ? r.memberNo : r.claimantNo) || 0;
      case 'name': return (curKind === 'income' ? r.memberName : r.claimantName) || '';
      case 'amt': return Number(r.amount) || 0;
      case 'sub': return (curKind === 'income' ? r.spouseName : r.payee) || '';
    }
    return '';
  }
  function sortRecs(rows) {
    const k = recSort.key, sign = recSort.dir === 'asc' ? 1 : -1;
    const strKey = (k === 'date' || k === 'item' || k === 'name' || k === 'sub');
    return rows.sort((a, b) => {
      const x = recSortVal(a, k), y = recSortVal(b, k);
      let c = strKey ? String(x).localeCompare(String(y), 'ko') : (x - y);
      if (c === 0) c = idCmp(a, b);   // 동점은 문서 id 로 고정
      return sign * c;
    });
  }
  const recTh = (k, label) => `<th class="sortable" data-rk="${k}">${label}${
    recSort.key === k ? `<span class="sar">${recSort.dir === 'asc' ? '▲' : '▼'}</span>` : ''}</th>`;

  function recRow(r, idno, who, sub) {
    const item = esc(r.c3 || r.c2 || r.c1 || '');
    const ymd = esc((r.date || '').replace(/-/g, ''));
    const on = selIds.has(r.id);
    // No. 열 자리에 체크박스를 넣는다. no 필드·offering.html 의 No. 열은 그대로 둔다.
    return `<tr class="${on ? 'sel' : ''}">
      <td class="ce"><input type="checkbox" class="ck" data-ck="${r.id}"${on ? ' checked' : ''} aria-label="선택"></td>
      <td>${fiscalYearOf(parseYMD(r.date))}</td><td>${wkNo(r)}</td><td>${ymd}</td>
      <td>${item}</td><td>${esc(idno)}</td><td>${esc(who)}</td>
      <td class="ra amt">${fmt(r.amount)}</td><td>${esc(sub)}</td>
      <td class="ce">${r.memo ? `<button class="iact i-note" data-note="${r.id}" aria-label="메모 보기">${SVG_NOTE}</button>` : '–'}</td>
      <td class="ce"><button class="iact i-edit" data-edit="${r.id}" aria-label="수정">${SVG_EDIT}</button><button class="iact i-del" data-del="${r.id}" aria-label="삭제">${SVG_DEL}</button></td>
    </tr>`;
  }
  // 헤더 체크박스 = 지금 보이는 목록 전체 토글. (검색·항목 필터로 걸러진 것만 대상이다)
  function ckAllTh(recs) {
    const all = recs.length > 0 && recs.every((r) => selIds.has(r.id));
    return `<th class="ce"><input type="checkbox" class="ck" id="ckAll"${all ? ' checked' : ''} aria-label="전체 선택"></th>`;
  }
  function incTable(rows) {
    const sorted = sortRecs(rows.slice());
    const body = sorted.map((r) =>
      recRow(r, r.memberNo ? '#' + r.memberNo : '', r.memberName || '', r.spouseName || '–')).join('');
    return `<div class="itblwrap"><table class="itbl">
      <thead><tr>${ckAllTh(sorted)}${recTh('fy', '회계년도')}${recTh('week', '주')}${recTh('date', '날짜')}${recTh('item', '항목')}${recTh('id', 'id')}${recTh('name', '이름')}${recTh('amt', '금액')}${recTh('sub', '배우자')}<th class="ce">비고</th><th class="ce">수정·삭제</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
  }
  function expTable(rows) {
    const sorted = sortRecs(rows.slice());
    const body = sorted.map((r) =>
      recRow(r, r.claimantNo ? '#' + r.claimantNo : '', r.claimantName || '', r.payee || '–')).join('');
    return `<div class="itblwrap"><table class="itbl">
      <thead><tr>${ckAllTh(sorted)}${recTh('fy', '회계년도')}${recTh('week', '주')}${recTh('date', '날짜')}${recTh('item', '항목')}${recTh('id', 'id')}${recTh('name', '청구인')}${recTh('amt', '금액')}${recTh('sub', '수령인')}<th class="ce">적요</th><th class="ce">수정·삭제</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
  }

  // 명세 목록의 정렬·메모·수정·삭제·일괄수정. renderAll 마다 새로 그려지므로 #body 에 위임한다.
  // ★ 체크박스는 renderAll() 을 부르지 않는다. 표를 통째로 다시 그리면 스크롤이 맨 위로 튄다.
  //   행 색과 패널만 손본다.
  function refreshBulk() {
    const recs = catFilterDocs(curKind === 'income' ? incDocs : expDocs);
    const host = $('bulkHost');
    if (host) host.innerHTML = bulkHtml(recs);
    const ckAll = $('ckAll');
    if (ckAll) ckAll.checked = recs.length > 0 && recs.every((r) => selIds.has(r.id));
  }
  $('body').addEventListener('change', (e) => {
    if (TYPE !== 'range' || !agg) return;
    // 항목을 고르면 닫힌 칸(.selface)에 '이름만' 다시 찍는다. 패널은 다시 그리지 않는다.
    if (e.target.id === 'bCat') { updateBCatFace(); return; }
    // 이름칸에서 포커스가 빠지면(change) 명부와 대조해 확정한다. 패널은 다시 그리지 않는다.
    if (e.target.id === 'bName') { bulkNameMatch(); return; }
    const recs = catFilterDocs(curKind === 'income' ? incDocs : expDocs);
    if (e.target.id === 'ckAll') {
      // 지금 화면에 보이는 것만 토글한다. 항목 필터로 걸러진 건 건드리지 않는다.
      const on = e.target.checked;
      recs.forEach((r) => { if (on) selIds.add(r.id); else selIds.delete(r.id); });
      document.querySelectorAll('.itbl [data-ck]').forEach((el) => {
        el.checked = on;
        el.closest('tr').classList.toggle('sel', on);
      });
      bulkOpen = selIds.size > 0;
      refreshBulk();
      return;
    }
    const ck = e.target.closest('[data-ck]');
    if (ck) {
      if (ck.checked) selIds.add(ck.dataset.ck); else selIds.delete(ck.dataset.ck);
      ck.closest('tr').classList.toggle('sel', ck.checked);
      bulkOpen = selIds.size > 0;   // 한 건이라도 고르면 패널이 열린다. 다 풀면 닫힌다.
      refreshBulk();
    }
  });

  // 이름칸: Enter 로 즉시 매칭. 다시 타이핑하면(input) 이전 확정을 풀어 오확정 저장을 막는다.
  $('body').addEventListener('keydown', (e) => {
    if (e.target.id === 'bName' && e.key === 'Enter') { e.preventDefault(); bulkNameMatch(); }
  });
  $('body').addEventListener('input', (e) => {
    if (e.target.id !== 'bName') return;
    // 확정된 이름과 지금 글자가 달라졌으면 확정을 해제한다(다시 매칭해야 저장된다).
    if (bulkName && e.target.value.trim() !== bulkName.name) {
      bulkName = null;
      const noEl = $('bMemNo'); if (noEl) noEl.textContent = '–';
      const box = $('bNameMsg'); if (box) box.innerHTML = '';
    }
  });

  $('body').addEventListener('click', async (e) => {
    if (TYPE !== 'range' || !agg) return;
    if (e.target.closest('#bSave')) { await bulkSave(); return; }
    if (e.target.closest('#bCancel') || e.target.closest('#bClose')) {
      bulkOpen = false; selIds.clear(); renderAll(); return;
    }
    const th = e.target.closest('th[data-rk]');
    if (th) {
      const k = th.dataset.rk;
      if (recSort.key === k) recSort.dir = (recSort.dir === 'asc' ? 'desc' : 'asc');
      else recSort = { key: k, dir: 'asc' };
      renderAll();
      return;
    }
    const note = e.target.closest('[data-note]');
    if (note) {
      const docs = curKind === 'income' ? incDocs : expDocs;
      const r = docs.find((x) => x.id === note.dataset.note);
      const bar = $('memoBar');
      if (r && bar) {
        bar.innerHTML = `<b>${curKind === 'income' ? '비고' : '적요'}:</b> ` + esc(r.memo || '');
        bar.style.display = 'block';
      }
      return;
    }
    const ed = e.target.closest('[data-edit]');
    if (ed) {
      // 편집 폼은 offering.html 에만 있다. 기간까지 넘겨야 그 기록이 목록에 잡혀 편집이 열린다.
      const r = qRange();
      const tab = curKind === 'income' ? 'inc' : 'exp';
      location.href = `offering.html?tab=${tab}&edit=${encodeURIComponent(ed.dataset.edit)}&from=${r.from}&to=${r.to}`;
      return;
    }
    const del = e.target.closest('[data-del]');
    if (del) {
      if (!confirm('이 기록을 삭제할까요?')) return;
      try {
        const coll = curKind === 'income' ? 'offerings' : 'expenses';
        const id = del.dataset.del;
        // 삭제도 로그를 남긴다. 문서가 사라지면 '무엇이 사라졌는지' 알 방법이 없다.
        const b = writeBatch(db);
        b.delete(doc(db, coll, id));
        addLog(b, { coll, docId: id, op: 'delete', by: me.uid });
        await b.commit();
        // 내가 지운 것을 로컬에도 반영한다. 안 하면 지운 기록이 화면에 계속 남는다.
        await sync();
        await reload();
        await showSyncAt();
      } catch (err) { alert('삭제 실패: ' + (err.code || err.message)); }
    }
  });

  function renderWarn() {
    const w = [];
    const add = (label, o) => {
      if (o.unmatchedCnt) w.push(`<b>${label} ${o.unmatchedCnt}건(${fmt(o.unmatchedAmt)}원)</b> 이 항목설정에 없는 이름으로 저장되어 있어 <b>표에서 빠졌습니다.</b> 항목명이 바뀌었는지 확인하세요.`);
      if (o.nonLeafCnt) w.push(`<b>${label} ${o.nonLeafCnt}건(${fmt(o.nonLeafAmt)}원)</b> 이 하위항목을 가진 항목에 저장되어 있어 표에서 빠졌습니다.`);
    };
    add('수입', agg.inc);
    add('지출', agg.exp);
    const box = $('warnBox');
    box.classList.toggle('on', w.length > 0);
    box.innerHTML = w.join('<br>');
  }

  function tableHtml(title, sub, groups, totLabel) {
    // 지출부는 '예산 − 결산'(덜 쓰면 +). title 로 부문을 판별해 diff 부호를 맞춘다.
    _diffExpense = (title && title.indexOf('지출') !== -1);
    const b = sumB(groups.flatMap((g) => g.rows));
    const a = sumA(groups.flatMap((g) => g.rows));
    const rows = [];
    groups.forEach((g) => {
      g.rows.forEach((r, i) => {
        rows.push(`<tr>
          <td class="g">${i === 0 ? esc(g.c1) : ''}</td>
          <td class="n">${esc(r.name)}</td>
          <td class="m">${r.budget ? fmt(r.budget) : ''}</td>
          <td class="m">${r.actual ? fmt(r.actual) : ''}</td>
          <td class="m${diffCls(r.budget, r.actual)}">${diff(r.budget, r.actual)}</td>
        </tr>`);
      });
      // 대분류가 하나뿐이면 소계 = 총계라 중복이다. 2개 이상일 때만 소계를 낸다.
      if (groups.length > 1) {
        rows.push(`<tr class="sub">
          <td class="g"></td><td class="n">소계</td>
          <td class="m">${fmt(g.budget)}</td><td class="m">${fmt(g.actual)}</td>
          <td class="m${diffCls(g.budget, g.actual)}">${diff(g.budget, g.actual)}</td>
        </tr>`);
      }
    });
    rows.push(`<tr class="tot">
      <td class="g"></td><td class="n">${esc(totLabel)}</td>
      <td class="m">${fmt(b)}</td><td class="m">${fmt(a)}</td>
      <td class="m${diffCls(b, a)}">${diff(b, a)}</td>
    </tr>`);
    return `<div class="sect">
      <div class="sh">${esc(title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</div>
      <table class="t">
        <colgroup><col class="c-g"><col class="c-n"><col class="c-m"><col class="c-m"><col class="c-d"></colgroup>
        <thead><tr><th class="hl">항목</th><th class="hn">소항목</th><th class="hr">예산</th><th class="hr">결산</th><th class="hr">차액</th></tr></thead>
        <tbody>${rows.join('')}</tbody>
      </table>
    </div>`;
  }

  // 차액 = 수입부: 결산 − 예산 / 지출부: 예산 − 결산 (예산이 0이면 비교 의미가 없어 비워 둔다)
  //   부문마다 '유리하면 +'가 되도록 부호를 맞춘다. 수입은 더 걷히면 +, 지출은 덜 쓰면 +.
  //   _diffExpense 는 tableHtml 이 지출부를 그리는 동안만 true 로 세운다.
  let _diffExpense = false;
  const diffVal = (budget, actual) => (_diffExpense ? budget - actual : actual - budget);
  // 차액 셀 색: 유리(+)=파랑 pos / 불리(−)=빨강 neg / 예산0(빈칸)·동일=색없음
  const diffCls = (budget, actual) => {
    if (!budget) return '';
    const d = diffVal(budget, actual);
    return d < 0 ? ' neg' : (d > 0 ? ' pos' : '');
  };
  function diff(budget, actual) {
    if (!budget) return '';
    const d = diffVal(budget, actual);
    const rate = ((actual || 0) / budget * 100).toFixed(1);   // 달성률 = 결산÷예산
    return `<span class="dn">${(d > 0 ? '+' : '') + fmt(d)}</span><span class="rt">(${rate}%)</span>`;
  }

  // ---- 기금별 잔액 ----
  // 통장은 하나지만 주머니는 5개다. 합산하면 일반재정 잔액이 부풀려진다.
  // ※ 목적기금 지출은 앱에 입력되어 있지 않다(엑셀에서 수기 입력). 여기서는 0으로 나온다.
  function fundBalance() {
    const out = FUNDS.map((f) => ({
      fund: f,
      carry: sumA(agg.carry.filter((r) => r.fund === f)),
      income: sumA(agg.normal.concat(agg.special).filter((r) => r.fund === f)),
      expense: sumA(agg.expRows.filter((r) => r.fund === f))
    }));
    out.forEach((o) => { o.bal = o.carry + o.income - o.expense; });
    return out.filter((o) => o.fund === DEFAULT_FUND || o.carry || o.income || o.expense);
  }

  function balanceHtml() {
    const list = fundBalance();
    const t = { carry: 0, income: 0, expense: 0, bal: 0 };
    list.forEach((o) => { t.carry += o.carry; t.income += o.income; t.expense += o.expense; t.bal += o.bal; });
    const rows = list.map((o) => `<tr>
      <td class="n" style="padding-left:10px;">${esc(o.fund === DEFAULT_FUND ? '일반재정' : o.fund)}</td>
      <td class="m">${fmt(o.carry)}</td>
      <td class="m">${fmt(o.income)}</td>
      <td class="m">${fmt(o.expense)}</td>
      <td class="m" style="font-weight:700;">${fmt(o.bal)}</td>
    </tr>`).join('');
    return `<div class="sect">
      <div class="sh">기금별 잔액<span class="sub">이월 + 수입 − 지출 = 잔액</span></div>
      <div class="lead">목적기금 지출은 앱에 입력되어 있지 않아 0으로 나옵니다. 엑셀에서 직접 채우세요.</div>
      <table class="t" style="margin-top:8px;">
        <colgroup><col><col class="c-m"><col class="c-m"><col class="c-m"><col class="c-m"></colgroup>
        <thead><tr><th class="hl">기금</th><th class="hr">이월금</th><th class="hr">수입</th><th class="hr">지출</th><th class="hr">잔액</th></tr></thead>
        <tbody>${rows}
          <tr class="tot">
            <td class="n" style="padding-left:10px;">합계</td>
            <td class="m">${fmt(t.carry)}</td><td class="m">${fmt(t.income)}</td>
            <td class="m">${fmt(t.expense)}</td><td class="m">${fmt(t.bal)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  // 수입 월별/주별 그리드. 상단바 '기타' 체크에 따라 '기타' 대분류를 넣거나 뺀다.
  //   끔(기본): 일반재정만 + 소계(합계 줄 없음) / 켬: 일반재정+기타 + 합계(지금까지의 기본 모습).
  function incGrid(title) {
    const tail = showSp ? agg.special : [];
    if (showEtc) return gridHtml(title, agg.normal, tail);
    const gen = agg.normal.filter((r) => r.c1 !== '기타');
    return gridHtml(title, gen, tail, { forceSub: true, noTotal: true });
  }

  // ---- 가로표 (년간 12개월 / 월간 주차 공용) ----
  // 이월은 넣지 않는다. 수입이 아니고, 한 칸에 뭉쳐 표를 왜곡한다.
  // tailRows(특별헌금)는 목적기금이라 합계에 넣지 않는다. 합계 '아래'에 별도 블록으로 붙인다.
  //   헌금 › 기타 › [합계 = 헌금+기타] › 특별헌금
  function gridHtml(title, rows, tailRows, opts) {
    opts = opts || {};   // forceSub: 대분류 1개여도 소계를 냄 / noTotal: 맨 아래 합계 줄 생략
    const tail = tailRows || [];
    if (!rows.length && !tail.length) return '';
    const labels = BK.labels;
    const cell = (v) => v ? fmt(v) : '';
    const line = (cls, g, nm, ms, tot) => `<tr class="${cls}">
      <td class="g fix1">${esc(g)}</td>
      <td class="n fix2">${esc(nm)}</td>
      ${ms.map((v) => `<td>${cell(v)}</td>`).join('')}
      <td class="sumcol">${fmt(tot)}</td>
    </tr>`;
    // forceSub: 블록에 대분류가 1개뿐이어도 소계를 낸다 (특별헌금은 합계와 겹치지 않으므로 필요하다)
    const block = (gs, forceSub) => {
      const out = [];
      gs.forEach((g) => {
        const gm = new Array(BK.n).fill(0);
        g.rows.forEach((r, i) => {
          r.months.forEach((v, k) => { gm[k] += v; });
          out.push(line('', i === 0 ? g.c1 : '', r.name, r.months, r.actual));
        });
        if (forceSub || gs.length > 1) out.push(line('sub', '', '소계', gm, g.actual));
      });
      return out;
    };

    const totM = new Array(BK.n).fill(0);
    rows.forEach((r) => r.months.forEach((v, k) => { totM[k] += v; }));

    const body = block(groupByC1(rows), opts.forceSub || false);
    if (!opts.noTotal) body.push(line('tot', '', '합계', totM, sumA(rows)));   // 헌금 + 기타 (특별헌금 제외)
    if (tail.length) {
      // 합계와 특별헌금 사이에 빈 줄 하나 (엑셀 출력과 같은 모양)
      body.push(`<tr class="spc"><td class="g fix1"></td><td class="n fix2"></td>${'<td></td>'.repeat(BK.n)}<td class="sumcol"></td></tr>`);
      block(groupByC1(tail), true).forEach((s) => body.push(s));
    }

    return `<div class="sect">
      <div class="sh">${esc(title)}<span class="sub">가로로 밀어서 보세요</span></div>
      <div class="scrollx">
        <table class="m">
          <thead><tr>
            <th class="fix1">항목</th><th class="fix2">소항목</th>
            ${labels.map((l) => `<th>${esc(l)}</th>`).join('')}
            <th>합계</th>
          </tr></thead>
          <tbody>${body.join('')}</tbody>
        </table>
      </div>
    </div>`;
  }

  // ---- 성도별 헌금 집계 ----
  // 수입(offerings)만. 이월은 사람이 없으니 뺀다. 열 = 헌금 항목(리프), 행 = 성도.
  // ※ 헌금 문서의 이름 필드는 name 이 아니라 memberName 이다. ID 는 memberNo, 명부 링크는 memberId.
  //   (offering.html 수동저장 804행 / 임포트 1502행 — 두 경로 모두 같은 필드로 쓴다)
  function memberHtml() {
    const cols = agg.normal.concat(agg.special);      // 이월 제외한 수입 리프 (트리 순서)
    if (!cols.length) return '<div class="loading">수입 항목이 없습니다.</div>';

    const byId = {}; nodes.forEach((n) => { byId[n.id] = n; });
    const keyMap = leafMap('income', byId);
    const colIdx = {}; cols.forEach((r, i) => { colIdx[r.id] = i; });

    const map = {};
    incDocs.forEach((d) => {
      const bi = BK.of(d.date);
      if (BK.strict && bi < 0) return;
      const n = keyMap[catKey(docPath(d))];
      if (!n || !(n.id in colIdx)) return;            // 미매칭·이월·비리프는 제외
      const nm = String(d.memberName || '').trim();
      const no = (d.memberNo === 0 || d.memberNo) ? String(d.memberNo) : '';
      // 사람을 가르는 기준은 명부 링크(memberId) 다. 이름만으로 묶으면 동명이인이 한 줄로 합쳐진다.
      const key = d.memberId || (nm ? 'N:' + nm : '(무기명)');
      if (!map[key]) map[key] = { no, name: nm || '(무기명)', cells: new Array(cols.length).fill(0), total: 0 };
      if (!map[key].no && no) map[key].no = no;       // 일부 문서에만 ID 가 붙어 있을 수 있다
      const amt = Number(d.amount || 0);
      map[key].cells[colIdx[n.id]] += amt;
      map[key].total += amt;
    });

    // ★ 검색은 '걸러내기'가 아니라 '찾아 주기'다. 목록은 늘 전원 그대로 두고 해당 행만 강조한다.
    //    걸러내면 앞뒤 사람과 견줘 볼 수가 없다.
    const qn = memQ;
    const list = Object.values(map).sort(memCmp);     // 기본 ID↑ · 헤더 클릭으로 바뀐다
    const all = list.length;
    const isHit = (m) => !!qn && m.name.includes(qn);
    const hits = list.filter(isHit);

    // 한 명으로 좁혀지면 ID 칸에 그 사람의 ID 를 띄운다.
    // (offering.html 에서 이름 Enter 치면 왼쪽 번호칸이 채워지는 것과 같은 동작)
    $('qNo').textContent = (hits.length === 1 && hits[0].no) ? padNo(hits[0].no) : '–';
